name: Apply permanent device release
on:
  push:
    branches: [feature/permanent-device-release]
permissions:
  contents: write
jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply permanent release patch
        run: python .github/scripts/apply-permanent-release.py
      - name: Verify backend and admin syntax
        run: |
          node --check backend/index.js
          node --check admin-panel/permanent-release.js
          grep -q "command === 'WIPE' || command === 'RELEASE_DEVICE_OWNER'" backend/index.js
          grep -q "applyFullOpen()" dpc-app/app/src/main/java/org/mdmopen/dpc/PolicyEnforcer.kt
          grep -q "requestSelfUninstall" dpc-app/app/src/main/java/org/mdmopen/dpc/CommandExecutor.kt
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Compile DPC
        working-directory: dpc-app
        run: gradle :app:compileDebugKotlin --no-daemon
      - name: Commit verified feature
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/index.js admin-panel/index.html admin-panel/permanent-release.js admin-panel/permanent-release.css dpc-app/app/src/main/java/org/mdmopen/dpc/PolicyEnforcer.kt dpc-app/app/src/main/java/org/mdmopen/dpc/CommandExecutor.kt
          if git diff --cached --quiet; then echo 'No changes'; exit 0; fi
          git commit -m "Add permanent device release and MDM removal flow"
          git push
