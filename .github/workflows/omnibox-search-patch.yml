name: One-off omnibox search patch

on:
  push:
    branches:
      - feature/browser-search-query-clean
    paths:
      - '.github/workflows/omnibox-search-patch.yml'

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v6
        with:
          ref: feature/browser-search-query-clean

      - name: Patch MainActivity narrowly
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('client/app/src/main/java/org/yehudikasher/browser/MainActivity.kt')
          s = p.read_text()

          replacements = [
              (
                  'import android.view.Gravity\nimport android.view.View\n',
                  'import android.view.Gravity\nimport android.view.View\nimport android.view.inputmethod.EditorInfo\n',
              ),
              (
                  '            hint = "הקלד כתובת אתר..."\n',
                  '            hint = "חיפוש או כתובת אתר..."\n',
              ),
              (
                  '            inputType = InputType.TYPE_CLASS_TEXT or InputType.TYPE_TEXT_VARIATION_URI\n',
                  '            inputType = InputType.TYPE_CLASS_TEXT or InputType.TYPE_TEXT_VARIATION_NORMAL\n            imeOptions = EditorInfo.IME_ACTION_GO\n',
              ),
              (
                  '            textDirection = View.TEXT_DIRECTION_LTR\n            setSingleLine(true)\n',
                  '            textDirection = View.TEXT_DIRECTION_FIRST_STRONG\n            setSingleLine(true)\n            setOnEditorActionListener { _, actionId, _ ->\n                if (actionId == EditorInfo.IME_ACTION_GO ||\n                    actionId == EditorInfo.IME_ACTION_SEARCH ||\n                    actionId == EditorInfo.IME_ACTION_DONE\n                ) {\n                    navigateFromAddressBar()\n                    true\n                } else {\n                    false\n                }\n            }\n',
              ),
              (
                  '    private fun navigateFromAddressBar() {\n        val raw = addressBar.text?.toString().orEmpty().trim()\n        val candidate = when {\n            raw.contains("://") -> raw\n            raw.isNotBlank() -> "https://$raw"\n            else -> ""\n        }\n        navigateToCandidate(candidate)\n    }\n',
                  '    private fun navigateFromAddressBar() {\n        val raw = addressBar.text?.toString().orEmpty()\n        val candidate = SearchInput.resolve(raw)\n        if (candidate.isBlank()) {\n            showHome()\n            return\n        }\n        navigateToCandidate(candidate)\n    }\n',
              ),
          ]

          for old, new in replacements:
              if s.count(old) != 1:
                  raise SystemExit(f'expected exactly one match, found {s.count(old)} for: {old[:80]!r}')
              s = s.replace(old, new, 1)

          p.write_text(s)
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: 8.9

      - name: Test and build browser
        working-directory: client
        run: gradle testDebugUnitTest assembleDebug

      - name: Commit verified patch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/app/src/main/java/org/yehudikasher/browser/MainActivity.kt
          git diff --cached --check
          git commit -m "Add filtered browser search queries"
          git push origin HEAD:feature/browser-search-query-clean
