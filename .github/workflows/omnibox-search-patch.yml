name: One-off omnibox search patch

on:
  push:
    branches:
      - feature/browser-search-query-clean
    paths:
      - '.github/workflows/omnibox-search-patch.yml'

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v6
        with:
          ref: feature/browser-search-query-clean

      - name: Patch MainActivity narrowly
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('client/app/src/main/java/org/yehudikasher/browser/MainActivity.kt')
          s = p.read_text()

          old_import = 'import android.view.Gravity\nimport android.view.View\n'
          new_import = 'import android.view.Gravity\nimport android.view.View\nimport android.view.inputmethod.EditorInfo\n'
          assert old_import in s
          s = s.replace(old_import, new_import, 1)

          old_bar = '''        addressBar = EditText(this).apply {
            hint = "הקלד כתובת אתר..."
            setHintTextColor(textDimColor)
            setTextColor(textColor)
            textSize = 13.5f
            inputType = InputType.TYPE_CLASS_TEXT or InputType.TYPE_TEXT_VARIATION_URI
            layoutDirection = View.LAYOUT_DIRECTION_LTR
            textDirection = View.TEXT_DIRECTION_LTR
            setSingleLine(true)
            background = null
            setPadding(dp(8), 0, dp(8), 0)
        }
'''
          new_bar = '''        addressBar = EditText(this).apply {
            hint = "חיפוש או כתובת אתר..."
            setHintTextColor(textDimColor)
            setTextColor(textColor)
            textSize = 13.5f
            inputType = InputType.TYPE_CLASS_TEXT or InputType.TYPE_TEXT_VARIATION_NORMAL
            imeOptions = EditorInfo.IME_ACTION_GO
            layoutDirection = View.LAYOUT_DIRECTION_LTR
            textDirection = View.TEXT_DIRECTION_FIRST_STRONG
            setSingleLine(true)
            setOnEditorActionListener { _, actionId, _ ->
                if (actionId == EditorInfo.IME_ACTION_GO ||
                    actionId == EditorInfo.IME_ACTION_SEARCH ||
                    actionId == EditorInfo.IME_ACTION_DONE
                ) {
                    navigateFromAddressBar()
                    true
                } else {
                    false
                }
            }
            background = null
            setPadding(dp(8), 0, dp(8), 0)
        }
'''
          assert old_bar in s
          s = s.replace(old_bar, new_bar, 1)

          old_nav = '''    private fun navigateFromAddressBar() {
        val raw = addressBar.text?.toString().orEmpty().trim()
        val candidate = when {
            raw.contains("://") -> raw
            raw.isNotBlank() -> "https://$raw"
            else -> ""
        }
        navigateToCandidate(candidate)
    }
'''
          new_nav = '''    private fun navigateFromAddressBar() {
        val raw = addressBar.text?.toString().orEmpty()
        val candidate = SearchInput.resolve(raw)
        if (candidate.isBlank()) {
            showHome()
            return
        }
        navigateToCandidate(candidate)
    }
'''
          assert old_nav in s
          s = s.replace(old_nav, new_nav, 1)

          p.write_text(s)
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: 8.9

      - name: Test and build browser
        working-directory: client
        run: gradle testDebugUnitTest assembleDebug

      - name: Commit verified patch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/app/src/main/java/org/yehudikasher/browser/MainActivity.kt
          git diff --cached --check
          git commit -m "Add filtered browser search queries"
          git push origin HEAD:feature/browser-search-query-clean
