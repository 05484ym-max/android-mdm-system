name: Patch Admin Panel Customer Workspace

on:
  push:
    branches:
      - fix/admin-panel-customer-workspace
    paths:
      - .github/patch-admin-panel-customer-workspace.py
      - .github/workflows/patch-admin-panel-customer-workspace.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/admin-panel-customer-workspace
          fetch-depth: 0
      - name: Apply guarded patch
        run: python3 .github/patch-admin-panel-customer-workspace.py
      - name: Verify panel
        run: |
          for f in admin-panel/*.js; do node --check "$f"; done
          node --check backend/test-admin-panel-functional-audit.js
          (cd backend && node test-admin-panel-functional-audit.js)
          git diff --check
      - name: Commit workspace cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/patch-admin-panel-customer-workspace.py .github/workflows/patch-admin-panel-customer-workspace.yml
          git add admin-panel/index.html admin-panel/customer-search.js admin-panel/diagnostics.js backend/test-admin-panel-functional-audit.js
          git diff --cached --check
          git commit -m "Consolidate admin customer workspace and diagnostics"
          git push origin HEAD:fix/admin-panel-customer-workspace
