name: One-off browser APK proxy patch

on:
  push:
    branches:
      - fix/stable-browser-apk-download
    paths:
      - '.github/workflows/one-off-browser-apk-proxy.yml'

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/stable-browser-apk-download

      - name: Patch fixed browser APK proxy route
        run: python3 backend/patch-browser-apk-proxy.py

      - name: Verify syntax and safety invariants
        run: |
          set -euo pipefail
          node --check backend/index.js
          grep -q "app.get('/downloads/yehudi-kasher-browser-latest.apk'" backend/index.js
          grep -q "LATEST_BROWSER_APK_UPSTREAM" backend/index.js
          grep -q "host.endsWith('.githubusercontent.com')" backend/index.js
          grep -q "Cache-Control', 'no-store'" backend/index.js
          grep -q "BROWSER_APK_MAX_BYTES" backend/index.js

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Run self-contained browser/image regression tests
        run: |
          set -euo pipefail
          node backend/test-browser-classifier.js
          node backend/test-image-moderator.js

      - name: Commit verified patch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/index.js
          git diff --cached --check
          git commit -m "Add stable backend browser APK download"
          git push origin HEAD:fix/stable-browser-apk-download
