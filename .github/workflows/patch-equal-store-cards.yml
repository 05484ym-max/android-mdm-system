name: Patch Equal Store Cards

on:
  push:
    branches:
      - fix/equal-store-cards

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/equal-store-cards
          fetch-depth: 0

      - name: Equalize customer app card title height
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('dpc-app/app/src/main/java/org/mdmopen/dpc/CustomerActivity.kt')
          s = p.read_text()
          old = '''                maxLines = 2
                setPadding(dp(2), dp(9), dp(2), 0)
'''
          new = '''                maxLines = 2
                minLines = 2
                ellipsize = android.text.TextUtils.TruncateAt.END
                setPadding(dp(2), dp(9), dp(2), 0)
'''
          if old not in s:
              raise SystemExit('target app title block not found')
          if s.count(old) != 1:
              raise SystemExit(f'expected exactly one target block, found {s.count(old)}')
          p.write_text(s.replace(old, new, 1))
          PY

      - name: Remove one-shot workflow and commit patch
        run: |
          rm .github/workflows/patch-equal-store-cards.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dpc-app/app/src/main/java/org/mdmopen/dpc/CustomerActivity.kt .github/workflows/patch-equal-store-cards.yml
          git diff --cached --check
          git commit -m "Keep customer app store cards equal height"
          git push origin HEAD:fix/equal-store-cards
