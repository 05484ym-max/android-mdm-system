name: Verify P0 media upload and accessibility fixes

on:
  push:
    branches: [ fix/news-media-upload-and-accessibility-window ]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Apply production patch
        run: python3 tools/patch-p0-media-accessibility.py
      - name: Check backend syntax
        run: node --check backend/index.js
      - name: Check news panel syntax
        run: node --check admin-panel/news.js
      - name: Build DPC
        working-directory: dpc-app
        run: gradle assembleDebug --stacktrace
      - name: Verify markers
        run: |
          python3 - <<'PY'
          from pathlib import Path
          backend = Path('backend/index.js').read_text(encoding='utf-8')
          news = Path('admin-panel/news.js').read_text(encoding='utf-8')
          policy = Path('dpc-app/app/src/main/java/org/mdmopen/dpc/PolicyEnforcer.kt').read_text(encoding='utf-8')
          customer = Path('dpc-app/app/src/main/java/org/mdmopen/dpc/CustomerActivity.kt').read_text(encoding='utf-8')
          assert "'image/heic'" in backend and "'image/heif'" in backend
          assert 'selectedMediaKind(file)' in news and 'heic|heif' in news
          assert 'setPermittedAccessibilityServices(admin, listOf(context.packageName))' in policy
          start = customer.index('private fun openWhatsAppAccessibilitySettings()')
          end = customer.index('private fun compactPersonalIdentityCard()', start)
          fn = customer[start:end]
          assert 'Settings.ACTION_ACCESSIBILITY_SETTINGS' not in fn
          assert 'Settings.ACTION_SETTINGS' in fn
          assert 'allowManagedAccessibilityService()' in fn
          print('P0 media/accessibility markers verified')
          PY
      - name: Commit production changes only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/index.js admin-panel/news.js \
            dpc-app/app/src/main/java/org/mdmopen/dpc/PolicyEnforcer.kt \
            dpc-app/app/src/main/java/org/mdmopen/dpc/CustomerActivity.kt
          if git diff --cached --quiet; then
            echo "No production change"
            exit 0
          fi
          git commit -m "Fix news image uploads and permit WhatsApp accessibility"
          git push
