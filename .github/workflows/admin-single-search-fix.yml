name: Admin single search fix

on:
  push:
    branches:
      - fix/admin-single-customer-search

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/admin-single-search-fix.py
      - run: |
          node -e "const fs=require('fs');const s=fs.readFileSync('admin-panel/index.html','utf8');const m=s.match(/<script>([\\s\\S]*?)<\\/script>/);if(!m)throw new Error('script not found');new Function(m[1]);"
          git diff --check
      - run: |
          rm .github/workflows/admin-single-search-fix.yml .github/scripts/admin-single-search-fix.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add admin-panel/index.html .github/workflows/admin-single-search-fix.yml .github/scripts/admin-single-search-fix.py
          git commit -m "Simplify admin customer search layout"
          git push
