name: Filtered Browser APK

on:
  push:
    branches:
      - filtered-browser-client
      - fix/filtered-browser-raster-icon
      - feature/automatic-browser-filtering-client
      - feature/haredi-image-filter-client
      - feature/filtered-browser-release-packaging
    paths:
      - 'client/**'
      - '.github/workflows/filtered-browser-apk.yml'
  pull_request:
    branches:
      - filtered-browser-client
    paths:
      - 'client/**'
      - '.github/workflows/filtered-browser-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: 8.9

      - name: Test and build browser
        working-directory: client
        run: gradle testDebugUnitTest assembleDebug

      - name: Verify raster icon fallback is packaged
        run: |
          set -euo pipefail
          APK=client/app/build/outputs/apk/debug/app-debug.apk
          unzip -l "$APK" | tee /tmp/apk-files.txt
          grep -E 'res/[^ ]*browser_icon\.png$' /tmp/apk-files.txt
          python3 - "$APK" <<'PY'
          import sys, zipfile
          apk = sys.argv[1]
          with zipfile.ZipFile(apk) as z:
              matches = [n for n in z.namelist() if n.startswith("res/") and n.endswith("browser_icon.png")]
              if not matches:
                  raise SystemExit("browser_icon.png missing from APK")
              data = z.read(matches[0])
              if not data.startswith(b"\x89PNG\r\n\x1a\n"):
                  raise SystemExit("browser icon fallback is not a valid PNG")
              if len(data) < 1024:
                  raise SystemExit("browser icon fallback is unexpectedly tiny")
              print(f"Verified {matches[0]} ({len(data)} bytes)")
          PY

      - name: Verify debug package and version
        run: |
          set -euo pipefail
          APK=client/app/build/outputs/apk/debug/app-debug.apk
          BADGING="$($ANDROID_HOME/build-tools/35.0.0/aapt dump badging "$APK" | head -n 1)"
          echo "$BADGING"
          grep -q "package: name='org.yehudikasher.browser'" <<<"$BADGING"
          grep -q "versionCode='2'" <<<"$BADGING"
          grep -q "versionName='0.2.0'" <<<"$BADGING"

      - name: Upload verified browser APK
        uses: actions/upload-artifact@v4
        with:
          name: filtered-browser-debug
          path: client/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  signed-release:
    name: Build and verify signed release APK
    if: >-
      github.event_name == 'workflow_dispatch' &&
      (github.ref == 'refs/heads/filtered-browser-client' ||
       github.ref == 'refs/heads/feature/filtered-browser-release-packaging')
    runs-on: ubuntu-latest
    env:
      BROWSER_RELEASE_KEYSTORE_B64: ${{ secrets.BROWSER_RELEASE_KEYSTORE_B64 }}
      BROWSER_RELEASE_STORE_PASSWORD: ${{ secrets.BROWSER_RELEASE_STORE_PASSWORD }}
      BROWSER_RELEASE_KEY_ALIAS: ${{ secrets.BROWSER_RELEASE_KEY_ALIAS }}
      BROWSER_RELEASE_KEY_PASSWORD: ${{ secrets.BROWSER_RELEASE_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: 8.9

      - name: Require all release signing secrets
        run: |
          set -euo pipefail
          for name in \
            BROWSER_RELEASE_KEYSTORE_B64 \
            BROWSER_RELEASE_STORE_PASSWORD \
            BROWSER_RELEASE_KEY_ALIAS \
            BROWSER_RELEASE_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "Required release signing secret is not configured: $name" >&2
              exit 1
            fi
          done

      - name: Decode release keystore
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$BROWSER_RELEASE_KEYSTORE_B64" | base64 --decode > /tmp/browser-release.keystore
          test -s /tmp/browser-release.keystore

      - name: Test and build unsigned release
        working-directory: client
        run: gradle testDebugUnitTest assembleRelease

      - name: Align and sign release APK
        run: |
          set -euo pipefail
          UNSIGNED=client/app/build/outputs/apk/release/app-release-unsigned.apk
          ALIGNED=/tmp/filtered-browser-release-aligned.apk
          SIGNED=client/app/build/outputs/apk/release/filtered-browser-release-signed.apk
          test -s "$UNSIGNED"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -f -p 4 "$UNSIGNED" "$ALIGNED"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks /tmp/browser-release.keystore \
            --ks-pass env:BROWSER_RELEASE_STORE_PASSWORD \
            --ks-key-alias "$BROWSER_RELEASE_KEY_ALIAS" \
            --key-pass env:BROWSER_RELEASE_KEY_PASSWORD \
            --out "$SIGNED" \
            "$ALIGNED"
          test -s "$SIGNED"

      - name: Verify release signature, package, version and icon
        run: |
          set -euo pipefail
          APK=client/app/build/outputs/apk/release/filtered-browser-release-signed.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK" | tee /tmp/signature.txt
          grep -q 'Verifies' /tmp/signature.txt
          BADGING="$($ANDROID_HOME/build-tools/35.0.0/aapt dump badging "$APK" | head -n 1)"
          echo "$BADGING"
          grep -q "package: name='org.yehudikasher.browser'" <<<"$BADGING"
          grep -q "versionCode='2'" <<<"$BADGING"
          grep -q "versionName='0.2.0'" <<<"$BADGING"
          unzip -l "$APK" | grep -E 'res/[^ ]*browser_icon\.png$'
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -p 4 "$APK"

      - name: Remove keystore
        if: always()
        run: rm -f /tmp/browser-release.keystore /tmp/filtered-browser-release-aligned.apk

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: filtered-browser-release-0.2.0
          path: client/app/build/outputs/apk/release/filtered-browser-release-signed.apk
          if-no-files-found: error
