name: Apply customer support feature

on:
  push:
    branches:
      - feature/customer-support

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mdm
          POSTGRES_PASSWORD: mdm
          POSTGRES_DB: mdm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U mdm -d mdm_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgresql://mdm:mdm@127.0.0.1:5432/mdm_test
      DATABASE_SSL: disable
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/customer-support
          fetch-depth: 0

      - name: Apply patch
        run: python3 backend/patch-customer-support.py

      - name: Verify JavaScript syntax
        run: |
          node --check backend/index.js
          node --check backend/db.js
          node --check admin-panel/support.js

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Run support database integration test
        working-directory: backend
        run: node test-support-tickets.js

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compile customer app
        run: gradle -p dpc-app :app:compileDebugKotlin

      - name: Commit verified feature
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Add customer support tickets to app and admin panel"
          git push origin HEAD:feature/customer-support
