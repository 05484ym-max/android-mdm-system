name: Build Device Lab Technician APK

on:
  push:
    branches: [ device-lab ]
    paths:
      - 'device-lab/**'
      - '.github/workflows/build-technician-app.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: device-lab/package-lock.json

      - name: Run Device Lab backend tests
        working-directory: device-lab
        run: |
          npm ci
          npm test

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Run protocol-core tests
        working-directory: device-lab/technician-app
        run: gradle :protocol-core:test --stacktrace

      - name: Build debug APK
        working-directory: device-lab/technician-app
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify APK
        run: |
          set -euo pipefail
          APK="device-lab/technician-app/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          ls -lh "$APK"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: device-lab-technician-debug
          path: device-lab/technician-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
