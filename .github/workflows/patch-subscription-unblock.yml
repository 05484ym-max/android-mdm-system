name: Apply subscription unblock feature

on:
  push:
    branches: [feature/subscription-unblock-grace]
    paths:
      - 'backend/patch-subscription-unblock.py'
      - '.github/workflows/patch-subscription-unblock.yml'

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mdm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mdm_test
      DATABASE_SSL: disable
      ALLOW_INSECURE_ADMIN: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/subscription-unblock-grace
      - name: Apply patch
        run: python3 backend/patch-subscription-unblock.py
      - name: Verify JavaScript syntax
        run: |
          node --check backend/index.js
          node --check admin-panel/customer-search.js
          node --check admin-panel/subscription-unblock.js
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci
      - name: Verify DB migration and unblock state
        working-directory: backend
        run: |
          node - <<'NODE'
          const db = require('./db');
          (async () => {
            await db.init();
            const d = await db.createDevice('9900000001', 'hash');
            if (d.subscriptionUnblockPermanent !== false) throw new Error('default permanent flag wrong');
            const until = new Date(Date.now() + 86400000).toISOString();
            const a = await db.setSubscriptionUnblock('9900000001', until, false);
            if (!a.subscriptionUnblockUntil || a.subscriptionUnblockPermanent) throw new Error('temporary unblock not stored');
            const b = await db.setSubscriptionUnblock('9900000001', null, true);
            if (!b.subscriptionUnblockPermanent || b.subscriptionUnblockUntil !== null) throw new Error('permanent unblock not stored');
            const c = await db.setSubscriptionUnblock('9900000001', null, false);
            if (c.subscriptionUnblockPermanent || c.subscriptionUnblockUntil !== null) throw new Error('clear unblock failed');
            console.log('subscription unblock DB verification passed');
            process.exit(0);
          })().catch(e => { console.error(e); process.exit(1); });
          NODE
      - name: Verify panel assets and routes
        run: |
          grep -F 'subscription-unblock.css' admin-panel/index.html
          grep -F 'customer-search.js' admin-panel/index.html
          grep -F 'subscription-unblock.js' admin-panel/index.html
          grep -F "/subscription-unblock'" backend/index.js
          grep -F 'subscriptionAccess: subscriptionAccess(req.device)' backend/index.js
      - name: Commit verified feature
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/db.js backend/index.js admin-panel/index.html admin-panel/customer-search.js admin-panel/subscription-unblock.js admin-panel/subscription-unblock.css
          git commit -m 'Add timed subscription unblock controls' || exit 0
          git push origin HEAD:feature/subscription-unblock-grace
