name: Fix recovery enrollment purpose select

on:
  push:
    branches:
      - fix/device-token-recovery

permissions:
  contents: write

jobs:
  patch-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply SELECT fix
        run: python tools/fix-recovery-purpose-select.py
      - name: Verify backend syntax and marker
        run: |
          node --check backend/db.js
          grep -F 'SELECT id, created_at, expires_at, used_at, device_id, purpose' backend/db.js
      - name: Commit production fix only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/db.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Include recovery purpose in enrollment listing'
          git push
