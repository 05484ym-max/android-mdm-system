name: Validate Browser Raster Icon

on:
  push:
    branches:
      - validation/browser-raster-icon
    paths:
      - '.github/workflows/validate-browser-icon.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout browser fix branch
        uses: actions/checkout@v6
        with:
          ref: fix/filtered-browser-raster-icon

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: 8.9

      - name: Build browser APK
        working-directory: client
        run: gradle testDebugUnitTest assembleDebug

      - name: Verify PNG fallback is packaged
        run: unzip -l client/app/build/outputs/apk/debug/app-debug.apk | grep browser_icon.png

      - name: Upload verified APK
        uses: actions/upload-artifact@v4
        with:
          name: filtered-browser-debug-raster-icon
          path: client/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
