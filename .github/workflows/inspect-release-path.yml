name: Inspect release path
on:
  push:
    branches: [feature/permanent-device-release]
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect command paths
        run: |
          echo '--- backend command routes ---'
          grep -n -E "commands|queue.*Command|RELEASE_DEVICE_OWNER" backend/index.js | head -120 || true
          echo '--- db command functions ---'
          grep -n -E "takePendingCommands|commands|queue.*Command" backend/db.js | head -120 || true
          echo '--- admin release references ---'
          grep -Rni -E "RELEASE_DEVICE_OWNER|הסר.*ניהול|שחרור" admin-panel | head -120 || true
