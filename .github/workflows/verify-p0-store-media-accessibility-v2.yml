name: Verify P0 store media accessibility v2

on:
  push:
    branches: [ fix/p0-store-media-accessibility-v2 ]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Apply production patch
        run: python3 tools/patch-p0-store-media-accessibility-v2.py
      - name: Check backend syntax
        run: |
          node --check backend/index.js
          node --check backend/db.js
          node --check admin-panel/news.js
      - name: Build DPC
        working-directory: dpc-app
        run: gradle assembleDebug --stacktrace
      - name: Verify P0 markers
        run: |
          python3 - <<'PY'
          from pathlib import Path
          store = Path('dpc-app/app/src/main/java/org/mdmopen/dpc/AppStoreActivity.kt').read_text()
          customer = Path('dpc-app/app/src/main/java/org/mdmopen/dpc/CustomerActivity.kt').read_text()
          policy = Path('dpc-app/app/src/main/java/org/mdmopen/dpc/PolicyEnforcer.kt').read_text()
          backend = Path('backend/index.js').read_text()
          db = Path('backend/db.js').read_text()
          news = Path('admin-panel/news.js').read_text()
          is_inst = store[store.index('private fun isInstalled'):store.index('private fun confirmQuickUninstall')]
          assert 'getApplicationInfo(packageName, 0)' in is_inst
          assert 'getLaunchIntentForPackage(packageName) != null' in is_inst
          assert 'isApplicationHidden(admin, packageName)' in is_inst
          assert 'accessibilitySetupWindowOpen = true' in customer
          assert 'enforcer.disableKiosk()' in customer
          assert 'Settings.ACTION_ACCESSIBILITY_SETTINGS' in customer
          assert 'restoreCachedKioskPolicy()' in customer
          assert 'fun restoreCachedKioskPolicy()' in policy
          assert 'getCustomerUpdateMediaByStorageKey' in backend and 'getCustomerUpdateMediaByStorageKey' in db
          assert 'NEWS_IMAGE_MAX_BYTES = 50 * 1024 * 1024' in backend
          assert 'const limit = 50 * 1024 * 1024' in news
          print('P0 v2 markers verified')
          PY
      - name: Commit production changes only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin-panel/news.js backend/index.js backend/db.js \
            dpc-app/app/src/main/java/org/mdmopen/dpc/AppStoreActivity.kt \
            dpc-app/app/src/main/java/org/mdmopen/dpc/CustomerActivity.kt \
            dpc-app/app/src/main/java/org/mdmopen/dpc/PolicyEnforcer.kt
          git commit -m "Fix live store state media upload and accessibility setup" || exit 0
          git push
