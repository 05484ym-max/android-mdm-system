name: Verify enrollment and login hardening v2

on:
  push:
    branches:
      - security/enrollment-login-hardening-v2

permissions:
  contents: write

jobs:
  patch-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply backend hardening patch
        run: python tools/patch-enrollment-login-hardening-v2.py
      - name: Verify backend syntax
        run: node --check backend/index.js
      - name: Verify hardening markers
        run: |
          grep -F "crypto.randomBytes(16)" backend/index.js
          grep -F "const loginLimiter = rateLimit({" backend/index.js
          grep -F "app.post('/api/login', loginLimiter" backend/index.js
          grep -F "const deviceRegistrationLimiter = rateLimit({" backend/index.js
          grep -F "app.post('/api/devices/register', deviceRegistrationLimiter" backend/index.js
          ! grep -F "const loginAttempts = new Map();" backend/index.js
      - name: Commit production change only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/index.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Harden enrollment and login rate limiting'
          git push
