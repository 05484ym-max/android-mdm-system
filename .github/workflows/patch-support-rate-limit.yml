name: Patch support rate limiting

on:
  push:
    branches: [feature/customer-support]
    paths:
      - 'backend/patch-support-rate-limit.py'
      - '.github/workflows/patch-support-rate-limit.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/customer-support
      - name: Apply patch
        run: python3 backend/patch-support-rate-limit.py
      - name: Verify syntax
        run: node --check backend/index.js
      - name: Verify limiters are attached
        run: |
          grep -F "supportTicketCreateLimiter" backend/index.js
          grep -F "supportTicketReadLimiter" backend/index.js
          grep -F "support-tickets', requireDevice, supportTicketCreateLimiter" backend/index.js
          grep -F "support-tickets', requireDevice, supportTicketReadLimiter" backend/index.js
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/index.js
          git commit -m 'Rate limit customer support device endpoints'
          git push origin HEAD:feature/customer-support
