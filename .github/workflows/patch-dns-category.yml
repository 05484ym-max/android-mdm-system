name: Apply DNS and category picker patch

on:
  push:
    branches:
      - fix/dns-green-category-picker

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/dns-green-category-picker
          fetch-depth: 0
      - name: Patch focused files
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # DNS switch: keep a strong green ON state even when admin-managed/disabled.
          p = Path('dpc-app/app/src/main/java/org/mdmopen/dpc/CustomerActivity.kt')
          s = p.read_text()
          old = '''                switchView = Switch(this@CustomerActivity).apply {
                    isChecked = actualOn
                    isEnabled = allowToggle
                }
'''
          new = '''                switchView = Switch(this@CustomerActivity).apply {
                    isChecked = actualOn
                    isEnabled = allowToggle
                    val states = arrayOf(
                        intArrayOf(android.R.attr.state_checked, android.R.attr.state_enabled),
                        intArrayOf(android.R.attr.state_checked, -android.R.attr.state_enabled),
                        intArrayOf(-android.R.attr.state_checked, android.R.attr.state_enabled),
                        intArrayOf(-android.R.attr.state_checked, -android.R.attr.state_enabled),
                    )
                    thumbTintList = android.content.res.ColorStateList(
                        states,
                        intArrayOf(
                            Color.WHITE,
                            Color.WHITE,
                            Color.parseColor("#F2F3F2"),
                            Color.parseColor("#F2F3F2"),
                        ),
                    )
                    trackTintList = android.content.res.ColorStateList(
                        states,
                        intArrayOf(
                            Color.parseColor("#1FA457"),
                            Color.parseColor("#1FA457"),
                            Color.parseColor("#B7BDB9"),
                            Color.parseColor("#B7BDB9"),
                        ),
                    )
                }
'''
          if old not in s:
              raise SystemExit('DNS switch anchor not found')
          p.write_text(s.replace(old, new, 1))

          # Backend: accept a category selected before Play import and save it immediately.
          p = Path('backend/index.js')
          s = p.read_text()
          old = '''app.post('/api/apps/from-play', requireAdmin, wrap(async (req, res) => {
  const { packageName } = req.body || {};
  if (typeof packageName !== 'string' || !PACKAGE_NAME_REGEX.test(packageName)) {
    return res.status(400).json({ error: 'invalid packageName format' });
  }
  try {
    const appInfo = await playStoreSearch.getPlayStoreApp(packageName);
    await db.addAppToCatalog(
      appInfo.packageName, appInfo.name, appInfo.iconUrl, appInfo.version, appInfo.updated,
      appInfo.category,
    );
'''
          new = '''app.post('/api/apps/from-play', requireAdmin, wrap(async (req, res) => {
  const { packageName, category } = req.body || {};
  if (typeof packageName !== 'string' || !PACKAGE_NAME_REGEX.test(packageName)) {
    return res.status(400).json({ error: 'invalid packageName format' });
  }
  let requestedCategory = null;
  if (category !== undefined && category !== null && category !== '') {
    if (typeof category !== 'string' || !(await isKnownAppCategory(category))) {
      return res.status(400).json({ error: 'invalid category' });
    }
    requestedCategory = category;
  }
  try {
    const appInfo = await playStoreSearch.getPlayStoreApp(packageName);
    await db.addAppToCatalog(
      appInfo.packageName, appInfo.name, appInfo.iconUrl, appInfo.version, appInfo.updated,
      requestedCategory || appInfo.category,
    );
'''
          if old not in s:
              raise SystemExit('from-play anchor not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Focused validation
        run: |
          node --check admin-panel/app-import.js
          node --check backend/index.js
          grep -q 'Color.parseColor("#1FA457")' dpc-app/app/src/main/java/org/mdmopen/dpc/CustomerActivity.kt
          grep -q 'requestedCategory || appInfo.category' backend/index.js
          grep -q 'בחר קטגוריה לאפליקציה' admin-panel/app-import.js
      - name: Commit patch and remove helper workflow
        run: |
          git rm .github/workflows/patch-dns-category.yml
          git add dpc-app/app/src/main/java/org/mdmopen/dpc/CustomerActivity.kt backend/index.js admin-panel/app-import.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Improve DNS switch state and app category import'
          git push origin HEAD:fix/dns-green-category-picker
