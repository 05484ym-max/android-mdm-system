name: WhatsApp detail init fix
on:
  push:
    branches: [ fix/whatsapp-detail-init ]
    paths:
      - 'admin-panel/patch_whatsapp_detail_init.py'
      - '.github/workflows/whatsapp-detail-init-fix.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/whatsapp-detail-init
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply patch
        run: python admin-panel/patch_whatsapp_detail_init.py
      - name: Syntax check
        run: node --check admin-panel/customer-search.js
      - name: Remove temporary files
        run: rm admin-panel/patch_whatsapp_detail_init.py .github/workflows/whatsapp-detail-init-fix.yml
      - name: Commit production fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Fix WhatsApp Guard full-management initialization'
          git push origin HEAD:fix/whatsapp-detail-init
