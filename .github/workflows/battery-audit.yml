name: DPC Battery Audit

on:
  pull_request:
    paths:
      - 'dpc-app/**'
      - '.github/workflows/battery-audit.yml'
  push:
    branches: [ main ]
    paths:
      - 'dpc-app/**'
      - '.github/workflows/battery-audit.yml'
  workflow_dispatch:

jobs:
  battery-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: 8.9

      - name: Verify battery-friendly scheduling invariants
        run: bash dpc-app/battery-audit-test.sh

      - name: Compile DPC
        working-directory: dpc-app
        run: gradle :app:compileDebugKotlin --no-daemon
