name: Local AI Runtime Smoke

on:
  push:
    branches:
      - feature/haredi-image-filter
      - main
    paths:
      - 'ai-service/**'
      - '.github/workflows/local-ai-runtime-smoke.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'ai-service/**'
      - '.github/workflows/local-ai-runtime-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime-smoke:
    name: Local AI FastAPI runtime smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install lightweight runtime test dependencies
        working-directory: ai-service
        run: |
          python -m pip install --disable-pip-version-check \
            fastapi==0.116.1 pillow==11.3.0 httpx==0.28.1
      - name: Run local AI runtime smoke tests
        working-directory: ai-service
        run: python -m unittest -v test_runtime_smoke.py
      - name: Compile service sources
        working-directory: ai-service
        run: python -m py_compile app.py policy.py test_runtime_smoke.py
