name: Apply one-tap fix on PR

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'fix/one-tap-install-play-kiosk-overlay'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}

      - name: Apply focused feature-branch transformations
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          from textwrap import dedent

          workflow = Path('.github/workflows/apply-one-tap-install-fix.yml').read_text()
          marker = "          python3 <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n          PY\n", start)
          raw = workflow[start:end]
          source = '\n'.join(line[10:] if line.startswith('          ') else line for line in raw.splitlines())

          # Skip brittle whole-block edits for the large CustomerActivity and
          # PolicyEnforcer snippets. Apply those two changes structurally below.
          customer_anchor = "customer = 'dpc-app/app/src/main/java/org/mdmopen/dpc/CustomerActivity.kt'"
          customer_start = source.index(customer_anchor)
          overlay_start = source.index("overlay = Path(", customer_start)
          source = source[:customer_start] + source[overlay_start:]

          policy_anchor = "policy = 'dpc-app/app/src/main/java/org/mdmopen/dpc/PolicyEnforcer.kt'"
          policy_start = source.index(policy_anchor)
          gate_start = source.index("gate = 'dpc-app/app/src/main/java/org/mdmopen/dpc/PlayStoreGate.kt'", policy_start)
          exec_source = source[:policy_start] + source[gate_start:]
          exec(compile(exec_source, 'apply-one-tap-install-fix.py', 'exec'))

          customer_path = Path('dpc-app/app/src/main/java/org/mdmopen/dpc/CustomerActivity.kt')
          customer = customer_path.read_text()
          fn_start = customer.index('    private fun installApp(app: CatalogApp) {')
          fn_end = customer.index('\n    private fun loadIcon(', fn_start)
          new_fn = dedent('''\
              private fun installApp(app: CatalogApp) {
                  if (!Config.storeAccessAllowed(this)) {
                      Toast.makeText(this, "המנוי פג — הורדות ועדכונים נעולים עד לחידוש", Toast.LENGTH_LONG).show()
                      showAppStore()
                      return
                  }
                  val apkUrl = app.apkUrl?.trim()?.takeIf { it.isNotEmpty() }
                  val apkSha256 = app.apkSha256?.trim()?.takeIf { it.isNotEmpty() }
                  if (apkUrl == null || apkSha256 == null) {
                      openPlayStoreForInstall(app.packageName)
                      return
                  }

                  // A complete verified APK pair is the managed one-tap path regardless
                  // of catalog source metadata. Google Play is only the fallback.
                  Toast.makeText(this, "מתחיל התקנה של ${app.name}", Toast.LENGTH_SHORT).show()
                  Thread {
                      try {
                          AppInstaller(applicationContext).installFromUrl(apkUrl, apkSha256)
                          runOnUiThread {
                              Toast.makeText(this@CustomerActivity, "ההתקנה התחילה", Toast.LENGTH_SHORT).show()
                          }
                      } catch (e: Exception) {
                          runOnUiThread {
                              Toast.makeText(this@CustomerActivity, "ההתקנה נכשלה: ${e.message ?: "שגיאה לא ידועה"}", Toast.LENGTH_LONG).show()
                              showAppStore()
                          }
                      }
                  }.start()
              }
          ''')
          customer_path.write_text(customer[:fn_start] + new_fn + customer[fn_end:])

          policy_path = Path('dpc-app/app/src/main/java/org/mdmopen/dpc/PolicyEnforcer.kt')
          policy = policy_path.read_text()
          fn_start = policy.index('    fun restoreCachedKioskPolicy() {')
          fn_end = policy.index('\n    fun disableKiosk()', fn_start)
          fn = policy[fn_start:fn_end]
          old = '            enableKiosk(Config.allowedApps(context).toSet())'
          if fn.count(old) != 1:
              raise SystemExit(f'PolicyEnforcer.restoreCachedKioskPolicy: expected one kiosk restore call, found {fn.count(old)}')
          fn = fn.replace(old, '            enableKiosk(Config.allowedApps(context).toSet() + playStoreTemporaryAllowance())', 1)
          policy_path.write_text(policy[:fn_start] + fn + policy[fn_end:])
          PY

          rm -f .github/workflows/apply-one-tap-install-fix.yml .github/workflows/apply-one-tap-on-pr.yml
          git show origin/main:.github/workflows/admin-panel-functional-audit.yml > .github/workflows/admin-panel-functional-audit.yml
          node backend/test-play-update-watcher-static.js
          git diff --check

      - name: Commit focused fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix one-tap installs, Play kiosk allowance, and overlay"
          git push origin HEAD:${{ github.head_ref }}
