name: Fix store installed-state detection

on:
  push:
    branches:
      - fix/store-installed-state
    paths:
      - .github/workflows/fix-store-installed-state.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/store-installed-state

      - name: Patch installed-state detection
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('dpc-app/app/src/main/java/org/mdmopen/dpc/AppStoreActivity.kt')
          s = p.read_text()
          old = '''    private fun isInstalled(packageName: String): Boolean {
        // Hidden packages can disappear from ordinary PackageManager lookups
        // on some OEM builds even though they are still physically installed.
        // MATCH_UNINSTALLED_PACKAGES lets us inspect their ApplicationInfo and
        // FLAG_INSTALLED distinguishes a real installed package from retained
        // metadata for an uninstalled package.
        val installedByPackageManager = try {
            val info = packageManager.getApplicationInfo(
                packageName,
                PackageManager.MATCH_UNINSTALLED_PACKAGES
            )
            (info.flags and ApplicationInfo.FLAG_INSTALLED) != 0
        } catch (_: Exception) {
            false
        }
        if (installedByPackageManager) return true

        // DevicePolicyManager is authoritative for apps hidden by this DPC.
        // If Android says this package is hidden by our Device Owner policy,
        // it necessarily exists on the device even if PackageManager omitted
        // it from the normal visible-package view.
        return try {
            val dpm = getSystemService(DevicePolicyManager::class.java)
            val admin = ComponentName(this, DpcDeviceAdminReceiver::class.java)
            dpm.isDeviceOwnerApp(this.packageName) &&
                dpm.isApplicationHidden(admin, packageName)
        } catch (_: Exception) {
            false
        }
    }
'''
          new = '''    private fun isInstalled(packageName: String): Boolean {
        // Approved/managed is not the same thing as installed. Query retained
        // package metadata so hidden apps are still visible, but only treat the
        // package as installed when Android sets FLAG_INSTALLED. Do not fall
        // back to DevicePolicyManager.isApplicationHidden(): policy state can
        // exist for an approved package and must never make an absent app look
        // installed in the customer store.
        return try {
            val info = packageManager.getApplicationInfo(
                packageName,
                PackageManager.MATCH_UNINSTALLED_PACKAGES
            )
            (info.flags and ApplicationInfo.FLAG_INSTALLED) != 0
        } catch (_: PackageManager.NameNotFoundException) {
            false
        } catch (_: Exception) {
            false
        }
    }
'''
          if old not in s:
              raise SystemExit('target isInstalled block not found')
          p.write_text(s.replace(old, new, 1))
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Compile DPC debug APK
        working-directory: dpc-app
        run: gradle assembleDebug

      - name: Commit verified fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dpc-app/app/src/main/java/org/mdmopen/dpc/AppStoreActivity.kt
          git commit -m "Fix app store installed-state detection"
          git push origin HEAD:fix/store-installed-state
