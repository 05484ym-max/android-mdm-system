name: Verify store installed state fix

on:
  push:
    branches:
      - "fix/store-installed-state"
    paths:
      - ".github/workflows/fix-store-installed-state.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/store-installed-state

      - name: Patch installed-state detection in runner
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("dpc-app/app/src/main/java/org/mdmopen/dpc/AppStoreActivity.kt")
          source = path.read_text()
          old = '''    private fun isInstalled(packageName: String): Boolean {
        // Hidden packages can disappear from ordinary PackageManager lookups
        // on some OEM builds even though they are still physically installed.
        // MATCH_UNINSTALLED_PACKAGES lets us inspect their ApplicationInfo and
        // FLAG_INSTALLED distinguishes a real installed package from retained
        // metadata for an uninstalled package.
        val installedByPackageManager = try {
            val info = packageManager.getApplicationInfo(
                packageName,
                PackageManager.MATCH_UNINSTALLED_PACKAGES
            )
            (info.flags and ApplicationInfo.FLAG_INSTALLED) != 0
        } catch (_: Exception) {
            false
        }
        if (installedByPackageManager) return true

        // DevicePolicyManager is authoritative for apps hidden by this DPC.
        // If Android says this package is hidden by our Device Owner policy,
        // it necessarily exists on the device even if PackageManager omitted
        // it from the normal visible-package view.
        return try {
            val dpm = getSystemService(DevicePolicyManager::class.java)
            val admin = ComponentName(this, DpcDeviceAdminReceiver::class.java)
            dpm.isDeviceOwnerApp(this.packageName) &&
                dpm.isApplicationHidden(admin, packageName)
        } catch (_: Exception) {
            false
        }
    }
'''
          new = '''    private fun isInstalled(packageName: String): Boolean {
        // Approved/managed is not the same thing as installed. Query retained
        // package metadata so hidden apps are still visible, but only treat the
        // package as installed when Android sets FLAG_INSTALLED.
        return try {
            val info = packageManager.getApplicationInfo(
                packageName,
                PackageManager.MATCH_UNINSTALLED_PACKAGES
            )
            (info.flags and ApplicationInfo.FLAG_INSTALLED) != 0
        } catch (_: PackageManager.NameNotFoundException) {
            false
        } catch (_: Exception) {
            false
        }
    }
'''
          if old not in source:
              raise SystemExit("target isInstalled block not found")
          path.write_text(source.replace(old, new, 1))
          PY

      - name: Verify UI installed-state conditions
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s = Path("dpc-app/app/src/main/java/org/mdmopen/dpc/AppStoreActivity.kt").read_text()
          checks = {
              'not installed shows install': '!installed -> "התקנה"',
              'open hidden when not installed': 'visibility = if (installed) View.VISIBLE else View.GONE',
              'APK installed action preserved': 'app.appSource == "APK" && installed -> "התקן/עדכן"',
              'PackageManager metadata lookup': 'PackageManager.MATCH_UNINSTALLED_PACKAGES',
              'FLAG_INSTALLED truth source': '(info.flags and ApplicationInfo.FLAG_INSTALLED) != 0',
          }
          for name, needle in checks.items():
              if needle not in s:
                  raise SystemExit(f"missing expected UI/state condition: {name}")
          block = s[s.index('private fun isInstalled'):s.index('private fun confirmQuickUninstall')]
          if 'isApplicationHidden' in block:
              raise SystemExit('isInstalled still depends on isApplicationHidden')
          print('UI/state checks passed')
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build DPC debug APK
        working-directory: dpc-app
        run: gradle assembleDebug --stacktrace
