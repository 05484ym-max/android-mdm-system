name: Patch Samsung Accessibility Launch v3

on:
  push:
    branches: [ fix/samsung-accessibility-launch-delay-v3 ]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/samsung-accessibility-launch-delay-v3
          fetch-depth: 0
      - name: Patch launch sequencing
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('dpc-app/app/src/main/java/org/mdmopen/dpc/CustomerActivity.kt')
          text = path.read_text()
          old = '''    private fun openWhatsAppAccessibilitySettings() {
        try {
            val enforcer = PolicyEnforcer(this)
            if (!enforcer.isDeviceOwner()) {
                Toast.makeText(this, "המכשיר אינו במצב ניהול מלא", Toast.LENGTH_LONG).show()
                return
            }
            enforcer.beginAccessibilitySetupWindow()
            try { stopLockTask() } catch (_: Exception) {}
            enforcer.disableKiosk()
            accessibilitySetupWindowOpen = true
        } catch (e: Exception) {
            Toast.makeText(this, "לא ניתן לפתוח חלון נגישות: ${e.message}", Toast.LENGTH_LONG).show()
            return
        }

        val attempts = listOf(
            Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS),
            Intent(Settings.ACTION_SETTINGS),
        )
        Toast.makeText(this, "הפעילו: יהודי כשר — הגנת WhatsApp", Toast.LENGTH_LONG).show()
        for (intent in attempts) {
            intent.addFlags(Intent.FLAG_ACTIVITY_CLEAR_TOP)
            if (intent.resolveActivity(packageManager) == null) continue
            try {
                startActivity(intent)
                return
            } catch (_: Exception) {}
        }
        accessibilitySetupWindowOpen = false
        try { PolicyEnforcer(this).finishAccessibilitySetupWindow() } catch (_: Exception) {}
        Toast.makeText(this, "לא ניתן לפתוח את הגדרות הנגישות במכשיר זה", Toast.LENGTH_LONG).show()
    }
'''
          new = '''    private fun openWhatsAppAccessibilitySettings() {
        try {
            val enforcer = PolicyEnforcer(this)
            if (!enforcer.isDeviceOwner()) {
                Toast.makeText(this, "המכשיר אינו במצב ניהול מלא", Toast.LENGTH_LONG).show()
                return
            }

            // Samsung/One UI may keep nested Settings pages blocked for a short
            // moment after lock-task is released. Open the persisted setup window
            // first, then release lock-task/kiosk, and only launch Settings after
            // the UI has had time to observe the policy transition.
            enforcer.beginAccessibilitySetupWindow()
            try { stopLockTask() } catch (_: Exception) {}
            enforcer.disableKiosk()
            accessibilitySetupWindowOpen = true
        } catch (e: Exception) {
            Toast.makeText(this, "לא ניתן לפתוח חלון נגישות: ${e.message}", Toast.LENGTH_LONG).show()
            return
        }

        Toast.makeText(
            this,
            "הפעילו: נגישות > אפליקציות מותקנות > יהודי כשר — הגנת WhatsApp",
            Toast.LENGTH_LONG
        ).show()

        android.os.Handler(android.os.Looper.getMainLooper()).postDelayed({
            if (isFinishing || isDestroyed) return@postDelayed

            val attempts = listOf(
                Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS),
                Intent(Settings.ACTION_SETTINGS),
            )
            for (intent in attempts) {
                intent.addFlags(Intent.FLAG_ACTIVITY_CLEAR_TOP or Intent.FLAG_ACTIVITY_NEW_TASK)
                if (intent.resolveActivity(packageManager) == null) continue
                try {
                    startActivity(intent)
                    return@postDelayed
                } catch (_: Exception) {}
            }

            // Only close the relaxed setup window if no Settings screen could
            // be launched at all. If Settings did launch, PolicySync remains
            // unable to re-lock accessibility until the service connects or the
            // existing bounded failsafe expires.
            accessibilitySetupWindowOpen = false
            try { PolicyEnforcer(this).finishAccessibilitySetupWindow() } catch (_: Exception) {}
            Toast.makeText(
                this,
                "לא ניתן לפתוח את הגדרות הנגישות במכשיר זה",
                Toast.LENGTH_LONG
            ).show()
        }, 700L)
    }
'''
          if old not in text:
              raise SystemExit('target function did not match current main; refusing unsafe patch')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit patch and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/patch-accessibility-launch-v3.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add dpc-app/app/src/main/java/org/mdmopen/dpc/CustomerActivity.kt .github/workflows/patch-accessibility-launch-v3.yml
          git commit -m "Delay Samsung accessibility launch until kiosk release settles"
          git push origin HEAD:fix/samsung-accessibility-launch-delay-v3
