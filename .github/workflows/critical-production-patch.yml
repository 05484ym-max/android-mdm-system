name: Critical Production Patch

on:
  push:
    branches: [fix/comprehensive-mdm-hardening]
    paths:
      - '.github/workflows/critical-production-patch.yml'

permissions:
  contents: write

jobs:
  guarded-patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/comprehensive-mdm-hardening
          fetch-depth: 0
      - name: Apply guarded production replacements
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('backend/index.js')
          text = path.read_text()

          register_pattern = re.compile(
              r"(?ms)^  const deviceId = await db\.generateUniqueDeviceId\(\);\n"
              r"  const consumed = await db\.consumeEnrollment\(\n"
              r"    sha256\(enrollmentToken\.trim\(\)\.toUpperCase\(\)\),\n"
              r"    deviceId,\n"
              r"  \);\n"
              r"  if \(!consumed\) \{\n"
              r"    return res\.status\(401\)\.json\(\{ error: 'invalid or expired enrollment token' \}\);\n"
              r"  \}\n\n"
              r"  const deviceToken = crypto\.randomBytes\(32\)\.toString\('hex'\);\n"
              r"  await db\.createDevice\(deviceId, sha256\(deviceToken\)\);\n"
              r"  res\.json\(\{ status: 'enrolled', deviceId, deviceToken \}\);"
          )
          new_register = '''  const tokenHash = sha256(enrollmentToken.trim().toUpperCase());
          const candidateDeviceId = await db.generateUniqueDeviceId();
          const enrolled = await db.registerDeviceIdempotent(tokenHash, candidateDeviceId);
          if (!enrolled) {
            return res.status(401).json({ error: 'invalid, expired, or already-finalized enrollment token' });
          }

          res.json({
            status: enrolled.replayed ? 'enrolled_replay' : 'enrolled',
            deviceId: enrolled.deviceId,
            deviceToken: enrolled.deviceToken,
          });'''

          classifier_pattern = re.compile(
              r"(?ms)^const browserClassifierRate = new Map\(\);\n"
              r"const BROWSER_CLASSIFIER_WINDOW_MS = 60 \* 1000;\n"
              r"const BROWSER_CLASSIFIER_MAX_MISSES_PER_WINDOW = 30;\n\n"
              r"function browserClassifierRateAllowed\(ip\) \{\n"
              r"  const now = Date\.now\(\);\n"
              r"  const key = String\(ip \|\| 'unknown'\)\.slice\(0, 100\);\n"
              r"  const state = browserClassifierRate\.get\(key\);\n"
              r"  if \(!state \|\| now - state\.startedAt >= BROWSER_CLASSIFIER_WINDOW_MS\) \{\n"
              r"    browserClassifierRate\.set\(key, \{ startedAt: now, misses: 1 \}\);\n"
              r"    return true;\n"
              r"  \}\n"
              r"  if \(state\.misses >= BROWSER_CLASSIFIER_MAX_MISSES_PER_WINDOW\) return false;\n"
              r"  state\.misses \+= 1;\n"
              r"  return true;\n"
              r"\}"
          )
          new_classifier = '''const browserClassifierRate = new Map();
          const BROWSER_CLASSIFIER_WINDOW_MS = 60 * 1000;
          const BROWSER_CLASSIFIER_MAX_MISSES_PER_WINDOW = 30;
          const PUBLIC_RATE_MAP_MAX_ENTRIES = 4096;

          function prunePublicRateMap(map, now, windowMs) {
            for (const [key, state] of map) {
              if (!state || now - state.startedAt >= windowMs * 2) map.delete(key);
            }
            while (map.size >= PUBLIC_RATE_MAP_MAX_ENTRIES) {
              const oldestKey = map.keys().next().value;
              if (oldestKey === undefined) break;
              map.delete(oldestKey);
            }
          }

          function browserClassifierRateAllowed(ip) {
            const now = Date.now();
            const key = String(ip || 'unknown').slice(0, 100);
            const state = browserClassifierRate.get(key);
            if (!state || now - state.startedAt >= BROWSER_CLASSIFIER_WINDOW_MS) {
              prunePublicRateMap(browserClassifierRate, now, BROWSER_CLASSIFIER_WINDOW_MS);
              browserClassifierRate.set(key, { startedAt: now, misses: 1 });
              return true;
            }
            if (state.misses >= BROWSER_CLASSIFIER_MAX_MISSES_PER_WINDOW) return false;
            state.misses += 1;
            return true;
          }'''

          image_pattern = re.compile(
              r"(?ms)^function imageProxyRateAllowed\(ip\) \{\n"
              r"  const now = Date\.now\(\);\n"
              r"  const key = String\(ip \|\| 'unknown'\)\.slice\(0, 100\);\n"
              r"  const state = imageProxyRate\.get\(key\);\n"
              r"  if \(!state \|\| now - state\.startedAt >= IMAGE_PROXY_WINDOW_MS\) \{\n"
              r"    imageProxyRate\.set\(key, \{ startedAt: now, count: 1 \}\);\n"
              r"    return true;\n"
              r"  \}\n"
              r"  if \(state\.count >= IMAGE_PROXY_MAX_REQUESTS_PER_WINDOW\) return false;\n"
              r"  state\.count \+= 1;\n"
              r"  return true;\n"
              r"\}"
          )
          new_image = '''function imageProxyRateAllowed(ip) {
            const now = Date.now();
            const key = String(ip || 'unknown').slice(0, 100);
            const state = imageProxyRate.get(key);
            if (!state || now - state.startedAt >= IMAGE_PROXY_WINDOW_MS) {
              prunePublicRateMap(imageProxyRate, now, IMAGE_PROXY_WINDOW_MS);
              imageProxyRate.set(key, { startedAt: now, count: 1 });
              return true;
            }
            if (state.count >= IMAGE_PROXY_MAX_REQUESTS_PER_WINDOW) return false;
            state.count += 1;
            return true;
          }'''

          replacements = [
              ('registration', register_pattern, new_register),
              ('classifier map', classifier_pattern, new_classifier),
              ('image map', image_pattern, new_image),
          ]
          for name, pattern, replacement in replacements:
              text, count = pattern.subn(replacement, text, count=1)
              if count != 1:
                  raise SystemExit(f'{name}: expected exactly one source block, found {count}')

          path.write_text(text)
          PY
          node --check backend/index.js
          grep -q 'registerDeviceIdempotent' backend/index.js
          grep -q 'PUBLIC_RATE_MAP_MAX_ENTRIES = 4096' backend/index.js
          grep -q 'prunePublicRateMap(imageProxyRate' backend/index.js
      - name: Commit guarded patch
        run: |
          if git diff --quiet; then
            echo 'No patch needed'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/index.js
          git commit -m 'Fix enrollment replay and bound public rate maps'
          git push origin HEAD:fix/comprehensive-mdm-hardening
