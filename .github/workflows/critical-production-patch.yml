name: Critical Production Patch

on:
  push:
    branches: [fix/comprehensive-mdm-hardening]
    paths:
      - '.github/workflows/critical-production-patch.yml'

permissions:
  contents: write

jobs:
  finalize-reliability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/comprehensive-mdm-hardening
          fetch-depth: 0
      - name: Make reliability schema initialization lazy and safe
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('backend/reliabilityBridge.js')
          text = path.read_text()
          old = '''  const ready = pool.query(`
              ALTER TABLE commands ADD COLUMN IF NOT EXISTS lease_expires_at TIMESTAMPTZ;
              ALTER TABLE commands ADD COLUMN IF NOT EXISTS attempt_count INTEGER NOT NULL DEFAULT 0;

              UPDATE commands
                 SET lease_expires_at = 'infinity'::timestamptz
               WHERE delivered_at IS NOT NULL
                 AND completed_at IS NULL
                 AND lease_expires_at IS NULL;

              CREATE INDEX IF NOT EXISTS commands_lease_due_idx
                ON commands (device_id, queued_at)
                WHERE completed_at IS NULL;

              CREATE TABLE IF NOT EXISTS enrollment_attempts (
                token_hash TEXT PRIMARY KEY,
                device_id TEXT NOT NULL REFERENCES devices(device_id) ON DELETE CASCADE,
                created_at TIMESTAMPTZ NOT NULL DEFAULT now()
              );
            `);'''
          new = '''  let readyPromise = null;
          function ensureReady() {
            if (!readyPromise) {
              // universalEntry installs this bridge before index.js invokes db.init().
              // Defer bridge DDL until first real operation; by then the HTTP server
              // is listening only after db.init() completed. Calling db.init() here as
              // well makes direct/test use safe and is idempotent.
              readyPromise = db.init().then(() => pool.query(`
                ALTER TABLE commands ADD COLUMN IF NOT EXISTS lease_expires_at TIMESTAMPTZ;
                ALTER TABLE commands ADD COLUMN IF NOT EXISTS attempt_count INTEGER NOT NULL DEFAULT 0;

                UPDATE commands
                   SET lease_expires_at = 'infinity'::timestamptz
                 WHERE delivered_at IS NOT NULL
                   AND completed_at IS NULL
                   AND lease_expires_at IS NULL;

                CREATE INDEX IF NOT EXISTS commands_lease_due_idx
                  ON commands (device_id, queued_at)
                  WHERE completed_at IS NULL;

                CREATE TABLE IF NOT EXISTS enrollment_attempts (
                  token_hash TEXT PRIMARY KEY,
                  device_id TEXT NOT NULL REFERENCES devices(device_id) ON DELETE CASCADE,
                  created_at TIMESTAMPTZ NOT NULL DEFAULT now()
                );
              `));
            }
            return readyPromise;
          }'''
          if text.count(old) != 1:
              raise SystemExit(f'ready block expected once, found {text.count(old)}')
          text = text.replace(old, new, 1)
          count = text.count('await ready;')
          if count < 5:
              raise SystemExit(f'expected multiple await ready sites, found {count}')
          text = text.replace('await ready;', 'await ensureReady();')
          path.write_text(text)
          PY
          node --check backend/reliabilityBridge.js
          grep -q 'function ensureReady()' backend/reliabilityBridge.js
          ! grep -q 'await ready;' backend/reliabilityBridge.js
      - name: Commit final patch and remove one-shot workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/critical-production-patch.yml
          git add backend/reliabilityBridge.js
          git commit -m 'Make reliability bootstrap ordering safe'
          git push origin HEAD:fix/comprehensive-mdm-hardening
