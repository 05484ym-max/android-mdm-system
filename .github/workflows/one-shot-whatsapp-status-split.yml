name: One-shot WhatsApp status split

on:
  push:
    branches:
      - fix/comprehensive-mdm-hardening
    paths:
      - '.github/workflows/one-shot-whatsapp-status-split.yml'
      - '.github/scripts/patch-whatsapp-status.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/comprehensive-mdm-hardening
          fetch-depth: 0

      - name: Apply WhatsApp status split
        run: python3 .github/scripts/patch-whatsapp-status.py

      - name: Remove temporary patch files and commit
        run: |
          rm .github/workflows/one-shot-whatsapp-status-split.yml
          rm .github/scripts/patch-whatsapp-status.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dpc-app/app/src/main/java/org/mdmopen/dpc/CustomerActivity.kt \
                  dpc-app/app/src/main/java/org/mdmopen/dpc/DeviceHealth.kt \
                  admin-panel/customer-search.js \
                  .github/workflows/whatsapp-guard-mdm-verify.yml \
                  .github/workflows/one-shot-whatsapp-status-split.yml \
                  .github/scripts/patch-whatsapp-status.py
          git commit -m "Split WhatsApp block status from accessibility reporting"
          git push origin HEAD:fix/comprehensive-mdm-hardening
