name: Build DPC APK

on:
  push:
    branches: [ main ]
    paths:
      - 'dpc-app/**'
      - '.github/workflows/build-dpc.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/dpc.jks"

      - name: Build debug APK
        working-directory: dpc-app
        env:
          DPC_KEYSTORE_PATH: ${{ runner.temp }}/dpc.jks
          DPC_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          DPC_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dpc-app-debug
          path: dpc-app/app/build/outputs/apk/debug/app-debug.apk
