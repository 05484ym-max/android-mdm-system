name: Build DPC APK

on:
  push:
    branches: [ main ]
    paths:
      - 'dpc-app/**'
      - '.github/workflows/build-dpc.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Restore shared debug keystore
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore-v1

      - name: Create debug keystore if missing
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            echo ">>> No cached keystore - generating a new one"
            keytool -genkeypair -keystore ~/.android/debug.keystore -storetype PKCS12 \
              -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass android -keypass android \
              -dname "CN=Android Debug,O=Android,C=US"
          else
            echo ">>> Reusing cached keystore"
          fi
          keytool -list -keystore ~/.android/debug.keystore -storepass android

      - name: Build debug APK
        working-directory: dpc-app
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dpc-app-debug
          path: dpc-app/app/build/outputs/apk/debug/app-debug.apk
