name: Verify store installed and update state

on:
  push:
    branches:
      - fix/store-installed-update-state

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-34' 'build-tools;34.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Apply store patch
        run: python tools/patch-store-update-state.py
      - name: Build DPC
        working-directory: dpc-app
        run: gradle assembleDebug --stacktrace
      - name: Verify store markers
        run: |
          FILE=dpc-app/app/src/main/java/org/mdmopen/dpc/AppStoreActivity.kt
          grep -F 'updateAvailable -> "עדכון"' "$FILE"
          grep -F 'else -> "מותקן"' "$FILE"
          grep -F 'PackageManager.NameNotFoundException' "$FILE"
          python - <<'PY'
          from pathlib import Path
          s = Path('dpc-app/app/src/main/java/org/mdmopen/dpc/AppStoreActivity.kt').read_text(encoding='utf-8')
          start = s.index('private fun isInstalled(packageName: String): Boolean')
          end = s.index('private fun confirmQuickUninstall', start)
          block = s[start:end]
          assert 'isApplicationHidden' not in block, block
          PY
      - name: Commit production change only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dpc-app/app/src/main/java/org/mdmopen/dpc/AppStoreActivity.kt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Fix store installed state and show real updates'
          git push
