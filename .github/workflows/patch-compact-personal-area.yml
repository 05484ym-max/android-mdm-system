name: Patch compact personal area

on:
  push:
    branches:
      - fix/news-client-bubbles-media-ui

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: ${{ !contains(github.event.head_commit.message, '[personal-area-done]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/news-client-bubbles-media-ui
          fetch-depth: 0
      - name: Apply compact personal area patch
        run: python3 .github/patch-compact-personal-area.py
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install SDK packages
        run: sdkmanager 'platform-tools' 'platforms;android-34' 'build-tools;34.0.0'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Compile DPC
        working-directory: dpc-app
        run: gradle :app:compileDebugKotlin
      - name: Verify admin JavaScript syntax
        run: node --check admin-panel/news.js
      - name: Commit checked UI patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dpc-app/app/src/main/java/org/mdmopen/dpc/CustomerActivity.kt
          if git diff --cached --quiet; then
            echo 'No UI patch changes to commit'
          else
            git commit -m 'Compact customer personal area [personal-area-done]'
            git push origin HEAD:fix/news-client-bubbles-media-ui
          fi
