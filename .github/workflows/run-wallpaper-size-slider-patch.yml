name: Run Wallpaper Size Slider Patch
on:
  push:
    branches: [feat/customer-wallpaper-branding-toggle]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/customer-wallpaper-branding-toggle
      - name: Apply patch
        run: python3 tools/patch_wallpaper_size_sliders.py
      - name: Commit result
        run: |
          rm tools/patch_wallpaper_size_sliders.py
          rm .github/workflows/run-wallpaper-size-slider-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add independent wallpaper emblem size sliders"
          git push origin HEAD:feat/customer-wallpaper-branding-toggle
