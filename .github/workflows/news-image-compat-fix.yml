name: News image compatibility fix

on:
  push:
    branches: [ fix/news-image-upload-compat ]
    paths:
      - 'backend/patch_news_heic_support.py'
      - '.github/workflows/news-image-compat-fix.yml'

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/news-image-upload-compat
      - name: Apply compatibility patch
        run: python3 backend/patch_news_heic_support.py
      - name: Verify backend syntax
        run: |
          node --check backend/index.js
          node --check backend/apkStorage.js
      - name: Verify expected media support
        run: |
          grep -q "image/heic" backend/index.js
          grep -q "image/heif" backend/index.js
          grep -q "'image/heic': 'heic'" backend/apkStorage.js
          grep -q "'image/heif': 'heif'" backend/apkStorage.js
      - name: Commit production-only fix
        run: |
          rm backend/patch_news_heic_support.py
          rm .github/workflows/news-image-compat-fix.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add backend/index.js backend/apkStorage.js backend/patch_news_heic_support.py .github/workflows/news-image-compat-fix.yml
          git commit -m "Support HEIC and HEIF images in customer updates"
          git push origin HEAD:fix/news-image-upload-compat
