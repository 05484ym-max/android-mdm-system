name: Apply full-open mode

on:
  push:
    branches: [feature/full-open-mode]
    paths:
      - '.github/workflows/apply-full-open-mode.yml'

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply full-open patch
        run: python3 .github/scripts/apply-full-open-mode.py

      - name: Verify backend syntax
        run: node --check backend/index.js && node --check backend/db.js && node --check admin-panel/full-open.js

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Compile DPC
        working-directory: dpc-app
        run: gradle compileDebugKotlin

      - name: Verify behavior markers
        run: |
          grep -q 'full_open_mode' backend/db.js
          grep -q "'/api/devices/:deviceId/full-open'" backend/index.js
          grep -q 'policy.fullOpen = fullOpen' backend/index.js
          grep -q 'if (policy.fullOpen) return applyFullOpen()' dpc-app/app/src/main/java/org/mdmopen/dpc/PolicyEnforcer.kt
          grep -q 'filteringRequested: false' backend/index.js
          grep -q 'full-open.js' admin-panel/index.html

      - name: Commit verified feature
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/db.js backend/index.js admin-panel/index.html dpc-app/app/src/main/java/org/mdmopen/dpc/ApiClient.kt dpc-app/app/src/main/java/org/mdmopen/dpc/PolicyEnforcer.kt
          git commit -m "Add reversible full-open device mode"
          git push origin HEAD:feature/full-open-mode
