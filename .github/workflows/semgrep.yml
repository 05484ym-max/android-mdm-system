name: Semgrep Security Scan

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'backend/**'
      - 'admin-panel/**'
      - 'dpc-app/app/src/**'
      - '.github/workflows/semgrep.yml'

permissions:
  contents: read

jobs:
  semgrep:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Semgrep
        run: python -m pip install --disable-pip-version-check 'semgrep==1.177.0'

      - name: Run production security scan
        run: |
          semgrep scan \
            --config p/security-audit \
            --severity ERROR \
            --error \
            --metrics=off \
            --exclude 'backend/test-*.js' \
            --exclude 'backend/fake*.js' \
            --exclude 'backend/**/*test*.js' \
            --exclude 'dpc-app/**/test/**' \
            --exclude 'dpc-app/**/androidTest/**' \
            --sarif-output semgrep.sarif \
            backend admin-panel dpc-app/app/src/main

      - name: Upload Semgrep report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-sarif
          path: semgrep.sarif
          if-no-files-found: ignore
