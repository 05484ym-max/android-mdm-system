name: Verify news HEIC picker

on:
  push:
    branches:
      - fix/news-heic-picker

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply picker patch
        run: python tools/patch-news-heic-picker.py
      - name: Verify picker support
        run: |
          grep -F 'image/heic,image/heif,.heic,.heif' admin-panel/index.html
          grep -F 'PNG/JPG/WebP/HEIC/HEIF/MP4/WebM' admin-panel/index.html
      - name: Commit production change only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin-panel/index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Allow HEIC and HEIF selection in news uploads'
          git push
