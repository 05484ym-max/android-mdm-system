name: Normalize Customer install function

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  normalize:
    if: github.head_ref == 'fix/one-tap-install-play-kiosk-overlay'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Normalize and self-clean
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('dpc-app/app/src/main/java/org/mdmopen/dpc/CustomerActivity.kt')
          text = p.read_text()
          start = text.index('private fun installApp(app: CatalogApp) {')
          end = text.index('\n    private fun loadIcon(', start)
          block = text[start:end]
          block = '\n'.join(('    ' + line) if line else '' for line in block.splitlines())
          p.write_text(text[:start] + block + text[end:])
          PY
          rm -f .github/workflows/fix-customer-indent.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Normalize CustomerActivity install function indentation"
          git push origin HEAD:${{ github.head_ref }}
