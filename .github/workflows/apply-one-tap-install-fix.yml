name: Apply one-tap install fix

on:
  push:
    branches:
      - fix/one-tap-install-play-kiosk-overlay
    paths:
      - .github/workflows/apply-one-tap-install-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/one-tap-install-play-kiosk-overlay

      - name: Apply focused changes
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one replacement target, found {count}")
              p.write_text(text.replace(old, new, 1))

          customer = 'dpc-app/app/src/main/java/org/mdmopen/dpc/CustomerActivity.kt'
          replace_once(customer, '''        if (app.appSource != "APK") {
              openPlayStoreForInstall(app.packageName)
              return
          }
          val apkUrl = app.apkUrl
          val apkSha256 = app.apkSha256
          if (apkUrl.isNullOrBlank() || apkSha256.isNullOrBlank()) {
              Toast.makeText(this, "קובץ ההתקנה אינו זמין כרגע", Toast.LENGTH_LONG).show()
              return
          }
          Toast.makeText(this, "מתחיל התקנה של ${app.name}", Toast.LENGTH_SHORT).show()
          Thread {
              try {
                  AppInstaller(applicationContext).installFromUrl(apkUrl, apkSha256)
                  runOnUiThread {
                      Toast.makeText(this@CustomerActivity, "ההתקנה נשלחה למכשיר", Toast.LENGTH_LONG).show()
                      showAppStore()
                  }
              } catch (e: Exception) {
                  runOnUiThread {
                      Toast.makeText(this@CustomerActivity, "ההתקנה נכשלה: ${e.message ?: "שגיאה לא ידועה"}", Toast.LENGTH_LONG).show()
                  }
              }
          }.start()
''', '''        val apkUrl = app.apkUrl?.trim()?.takeIf { it.isNotEmpty() }
          val apkSha256 = app.apkSha256?.trim()?.takeIf { it.isNotEmpty() }
          if (apkUrl == null || apkSha256 == null) {
              openPlayStoreForInstall(app.packageName)
              return
          }

          // Managed catalog entries are truly one-tap: whenever a verified APK
          // URL + SHA-256 are present, prefer PackageInstaller even if the catalog
          // also has Play metadata. Play is only the fallback for entries without
          // a complete managed APK pair.
          Toast.makeText(this, "מתחיל התקנה של ${app.name}", Toast.LENGTH_SHORT).show()
          Thread {
              try {
                  AppInstaller(applicationContext).installFromUrl(apkUrl, apkSha256)
                  runOnUiThread {
                      Toast.makeText(this@CustomerActivity, "ההתקנה התחילה", Toast.LENGTH_SHORT).show()
                  }
              } catch (e: Exception) {
                  runOnUiThread {
                      Toast.makeText(this@CustomerActivity, "ההתקנה נכשלה: ${e.message ?: "שגיאה לא ידועה"}", Toast.LENGTH_LONG).show()
                      showAppStore()
                  }
              }
          }.start()
''')

          overlay = Path('dpc-app/app/src/main/java/org/mdmopen/dpc/InstallOverlay.kt')
          overlay.write_text('''package org.mdmopen.dpc

          import android.content.Context
          import android.content.Intent
          import android.graphics.Color
          import android.graphics.PixelFormat
          import android.graphics.Typeface
          import android.os.Build
          import android.provider.Settings
          import android.util.Log
          import android.view.Gravity
          import android.view.WindowManager
          import android.widget.LinearLayout
          import android.widget.ProgressBar
          import android.widget.TextView

          /**
           * Partial guarded-install overlay over the lower part of Google Play.
           * The upper Play area remains visible and interactive for Play's own
           * install/update button and real progress UI.
           */
          object InstallOverlay {
              private const val TAG = "InstallOverlay"
              private const val SHIELD_HEIGHT_RATIO = 0.69f
              private var view: LinearLayout? = null

              fun show(context: Context, appName: String): Boolean {
                  if (view != null) return true
                  val appContext = context.applicationContext

                  // SYSTEM_ALERT_WINDOW is special app access; Device Owner does
                  // not guarantee it on every OEM/build. Fail explicitly so the
                  // guarded Activity fallback can take over instead of failing silently.
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M && !Settings.canDrawOverlays(appContext)) {
                      Log.w(TAG, "Partial install overlay unavailable: draw-over-other-apps permission is not granted")
                      return false
                  }

                  val windowManager = appContext.getSystemService(Context.WINDOW_SERVICE) as WindowManager
                  val overlay = LinearLayout(appContext).apply {
                      orientation = LinearLayout.VERTICAL
                      gravity = Gravity.CENTER
                      setPadding(48, 36, 48, 36)
                      setBackgroundColor(Color.parseColor("#F7F2E8"))
                      isClickable = true
                      isFocusable = true

                      addView(TextView(appContext).apply {
                          text = "מתקין את $appName"
                          textSize = 16f
                          typeface = Typeface.create("sans-serif", Typeface.BOLD)
                          setTextColor(Color.parseColor("#1C231D"))
                          gravity = Gravity.CENTER
                          setPadding(0, 0, 0, 24)
                      })

                      addView(ProgressBar(appContext, null, android.R.attr.progressBarStyleHorizontal).apply {
                          isIndeterminate = true
                      }, LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, 18).apply {
                          bottomMargin = 28
                      })

                      addView(TextView(appContext).apply {
                          text = "סגור וחזור לחנות"
                          textSize = 14f
                          typeface = Typeface.create("sans-serif", Typeface.BOLD)
                          setTextColor(Color.WHITE)
                          gravity = Gravity.CENTER
                          setBackgroundColor(Color.parseColor("#245E38"))
                          setPadding(36, 22, 36, 22)
                          isClickable = true
                          isFocusable = true
                          setOnClickListener {
                              PlayStoreGate.cancelCurrentInstall(appContext)
                              hide(appContext)
                              runCatching {
                                  appContext.startActivity(
                                      Intent(appContext, CustomerActivity::class.java)
                                          .addFlags(Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_ACTIVITY_CLEAR_TOP)
                                  )
                              }
                          }
                      })
                  }

                  val overlayType =
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O)
                          WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY
                      else
                          @Suppress("DEPRECATION") WindowManager.LayoutParams.TYPE_SYSTEM_ALERT

                  val shieldHeight = (appContext.resources.displayMetrics.heightPixels * SHIELD_HEIGHT_RATIO).toInt()
                  val params = WindowManager.LayoutParams(
                      WindowManager.LayoutParams.MATCH_PARENT,
                      shieldHeight,
                      overlayType,
                      WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN,
                      PixelFormat.OPAQUE,
                  ).apply {
                      gravity = Gravity.BOTTOM
                  }

                  return try {
                      windowManager.addView(overlay, params)
                      view = overlay
                      true
                  } catch (e: Exception) {
                      Log.e(TAG, "Could not attach partial install overlay", e)
                      false
                  }
              }

              fun hide(context: Context) {
                  val current = view ?: return
                  view = null
                  val windowManager = context.applicationContext.getSystemService(Context.WINDOW_SERVICE) as WindowManager
                  try {
                      windowManager.removeView(current)
                  } catch (e: Exception) {
                      Log.w(TAG, "Could not remove install overlay cleanly", e)
                  }
              }
          }
          '''.replace('\n          ', '\n').lstrip())

          policy = 'dpc-app/app/src/main/java/org/mdmopen/dpc/PolicyEnforcer.kt'
          replace_once(policy, '''        if (Config.kioskEnabled(context)) {
              enableKiosk(Config.allowedApps(context).toSet())
          } else {
''', '''        if (Config.kioskEnabled(context)) {
              // The cached kiosk policy must include a currently-active guarded
              // Play allowance immediately; otherwise lock task can block Play's
              // own install/update button even though the app is unhidden.
              enableKiosk(Config.allowedApps(context).toSet() + playStoreTemporaryAllowance())
          } else {
''')

          gate = 'dpc-app/app/src/main/java/org/mdmopen/dpc/PlayStoreGate.kt'
          replace_once(gate, '''            Config.setPlayStoreAllowedUntil(appContext, deadline)
              dpm.setApplicationHidden(admin, PACKAGE, false)
              ManagedInstallWindow.open(appContext)
''', '''            Config.setPlayStoreAllowedUntil(appContext, deadline)
              dpm.setApplicationHidden(admin, PACKAGE, false)
              ManagedInstallWindow.open(appContext)
              refreshKioskPolicy(appContext, failOnError = true)
''')
          replace_once(gate, '''        if (!InstallOverlay.show(appContext, appName)) {
              Log.w(TAG, "Partial install overlay unavailable on this device; guarded package policy remains active")
          }
''', '''        if (!InstallOverlay.show(appContext, appName)) {
              Log.w(TAG, "Partial install overlay unavailable; showing guarded fallback immediately")
              launchBlockingActivity(appContext)
          }
''')
          # Every session-ending path expires the Play allowance. Restore the cached
          # kiosk package set immediately after expiry so Play is removed again.
          p = Path(gate)
          text = p.read_text()
          needle = 'Config.setPlayStoreAllowedUntil(appContext, System.currentTimeMillis())'
          if text.count(needle) != 4:
              raise SystemExit(f'{gate}: expected 4 appContext allowance-expiry sites, found {text.count(needle)}')
          text = text.replace(needle, needle + '\n        refreshKioskPolicy(appContext)')
          needle2 = 'Config.setPlayStoreAllowedUntil(context, System.currentTimeMillis())'
          if text.count(needle2) != 2:
              raise SystemExit(f'{gate}: expected 2 context allowance-expiry sites, found {text.count(needle2)}')
          text = text.replace(needle2, needle2 + '\n        refreshKioskPolicy(context)')
          anchor = '''    private fun closePlayUi(context: Context) {
'''
          helper = '''    private fun refreshKioskPolicy(context: Context, failOnError: Boolean = false) {
              try {
                  val enforcer = PolicyEnforcer(context)
                  if (enforcer.isDeviceOwner()) enforcer.restoreCachedKioskPolicy()
              } catch (e: Exception) {
                  Log.e(TAG, "Could not refresh kiosk packages for Play install window", e)
                  if (failOnError) throw e
              }
          }

          private fun launchBlockingActivity(context: Context) {
              runCatching {
                  context.startActivity(
                      Intent(context, PlayInstallBlockingActivity::class.java)
                          .addFlags(Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_ACTIVITY_SINGLE_TOP or Intent.FLAG_ACTIVITY_REORDER_TO_FRONT)
                  )
              }.onFailure { Log.e(TAG, "Could not show guarded install fallback", it) }
          }

'''.replace('\n          ', '\n')
          if text.count(anchor) != 1:
              raise SystemExit(f'{gate}: closePlayUi anchor missing/duplicated')
          text = text.replace(anchor, helper + anchor, 1)
          p.write_text(text)

          command = 'dpc-app/app/src/main/java/org/mdmopen/dpc/CommandExecutor.kt'
          replace_once(command, '''        "REBOOT" -> {
              dpm.reboot(admin)
              "אתחול הופעל"
          }
''', '''        "REBOOT" -> {
              check(PlayInstallGuard.activeSession(context) == null && !ManagedInstallWindow.isOpen(context)) {
                  "אתחול נדחה: קיימת כרגע התקנה או עדכון פעילים"
              }
              dpm.reboot(admin)
              "אתחול הופעל"
          }
''')

          receiver = 'dpc-app/app/src/main/java/org/mdmopen/dpc/InstallResultReceiver.kt'
          replace_once(receiver, 'import android.util.Log\n', 'import android.util.Log\nimport android.widget.Toast\n')
          replace_once(receiver, '''        if (commandId == null) return

          val current = CommandJournal.get(context, commandId)
''', '''        if (commandId == null) {
              // Customer-store managed installs do not have a remote command id.
              // Refresh only after PackageInstaller reports the real outcome, not
              // immediately after Session.commit(). This makes one-tap updates
              // return to the store as installed instead of showing stale state.
              if (status == PackageInstaller.STATUS_SUCCESS) {
                  packageName?.let { PlayCatalogUpdateState.acknowledgeInstalledVersion(context, it) }
                  runCatching {
                      context.applicationContext.startActivity(
                          Intent(context.applicationContext, CustomerActivity::class.java)
                              .addFlags(Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_ACTIVITY_CLEAR_TOP)
                      )
                  }
              } else if (status != PackageInstaller.STATUS_PENDING_USER_ACTION) {
                  Toast.makeText(
                      context.applicationContext,
                      "ההתקנה נכשלה: ${message ?: "שגיאה לא ידועה"}",
                      Toast.LENGTH_LONG,
                  ).show()
              }
              return
          }

          val current = CommandJournal.get(context, commandId)
''')

          test = 'backend/test-play-update-watcher-static.js'
          p = Path(test)
          text = p.read_text()
          replace_map = [
              ("const policySync = fs.readFileSync(__dirname + '/../dpc-app/app/src/main/java/org/mdmopen/dpc/PolicySync.kt', 'utf8');\n",
               "const policySync = fs.readFileSync(__dirname + '/../dpc-app/app/src/main/java/org/mdmopen/dpc/PolicySync.kt', 'utf8');\nconst policyEnforcer = fs.readFileSync(__dirname + '/../dpc-app/app/src/main/java/org/mdmopen/dpc/PolicyEnforcer.kt', 'utf8');\nconst commandExecutor = fs.readFileSync(__dirname + '/../dpc-app/app/src/main/java/org/mdmopen/dpc/CommandExecutor.kt', 'utf8');\nconst installResult = fs.readFileSync(__dirname + '/../dpc-app/app/src/main/java/org/mdmopen/dpc/InstallResultReceiver.kt', 'utf8');\n"),
              ('''assert.match(customer, /updateAvailable -> "עדכון זמין"/);\n''', '''assert.match(customer, /updateAvailable -> "עדכון זמין"/);\nassert.doesNotMatch(customer, /if \\(app\\.appSource != "APK"\\)/);\nassert.match(customer, /val apkUrl = app\\.apkUrl\\?\\.trim\\(\\)\\?\\.takeIf/);\nassert.match(customer, /val apkSha256 = app\\.apkSha256\\?\\.trim\\(\\)\\?\\.takeIf/);\nassert.match(customer, /if \\(apkUrl == null \\|\\| apkSha256 == null\\)[\\s\\S]*openPlayStoreForInstall\\(app\\.packageName\\)/);\nassert.match(customer, /AppInstaller\\(applicationContext\\)\\.installFromUrl\\(apkUrl, apkSha256\\)/);\n'''),
              ('''assert.doesNotMatch(playGate, /launchBlockingActivity/);\n''', '''assert.match(playGate, /launchBlockingActivity\\(appContext\\)/);\nassert.match(playGate, /refreshKioskPolicy\\(appContext, failOnError = true\\)/);\n'''),
              ('''assert.match(installOverlay, /heightPixels \\* 0\\.55f/);\n''', '''assert.match(installOverlay, /SHIELD_HEIGHT_RATIO = 0\\.69f/);\n'''),
              ('''assert.match(installOverlay, /החלק העליון של Google Play נשאר גלוי/);\n''', '''assert.doesNotMatch(installOverlay, /התקנה מאובטחת פעילה/);\nassert.doesNotMatch(installOverlay, /החלק העליון של Google Play נשאר גלוי כדי שתראה/);\nassert.match(installOverlay, /text = "מתקין את \\$appName"/);\nassert.match(installOverlay, /Settings\\.canDrawOverlays\\(appContext\\)/);\n'''),
          ]
          for old, new in replace_map:
              if text.count(old) != 1:
                  raise SystemExit(f'{test}: replacement target count={text.count(old)} for {old[:80]!r}')
              text = text.replace(old, new, 1)

          marker = "assert.match(installOverlay, /סגור וחזור לחנות/);\n"
          extra = '''assert.match(playGate, /private fun closePlayUi[\\s\\S]*InstallOverlay\\.hide\\(context\\)/);\nassert.match(policyEnforcer, /enableKiosk\\(Config\\.allowedApps\\(context\\)\\.toSet\\(\\) \\+ playStoreTemporaryAllowance\\(\\)\\)/);\nassert.match(playGate, /Config\\.setPlayStoreAllowedUntil\\(appContext, System\\.currentTimeMillis\\(\\)\\)[\\s\\S]*refreshKioskPolicy\\(appContext\\)/);\nassert.match(playGate, /Config\\.setPlayStoreAllowedUntil\\(context, System\\.currentTimeMillis\\(\\)\\)[\\s\\S]*refreshKioskPolicy\\(context\\)/);\nassert.match(commandExecutor, /"REBOOT" -> \\{[\\s\\S]*PlayInstallGuard\\.activeSession\\(context\\) == null && !ManagedInstallWindow\\.isOpen\\(context\\)[\\s\\S]*dpm\\.reboot\\(admin\\)/);\nassert.match(installResult, /PackageInstaller\\.STATUS_SUCCESS[\\s\\S]*PlayCatalogUpdateState\\.acknowledgeInstalledVersion[\\s\\S]*CustomerActivity::class\\.java/);\n'''
          if text.count(marker) != 1:
              raise SystemExit(f'{test}: overlay button marker missing/duplicated')
          text = text.replace(marker, marker + extra, 1)
          p.write_text(text)
          PY

          rm -f .github/workflows/apply-one-tap-install-fix.yml

      - name: Run focused static regression
        run: node backend/test-play-update-watcher-static.js

      - name: Commit feature changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Fix one-tap installs, Play kiosk allowance, and overlay"
          git push origin HEAD:fix/one-tap-install-play-kiosk-overlay
