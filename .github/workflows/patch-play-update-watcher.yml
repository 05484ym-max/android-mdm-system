name: Patch Play Update Watcher

on:
  push:
    branches:
      - feat/play-update-watcher

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/play-update-watcher
      - name: Apply implementation patch
        run: |
          echo '' | base64 -d > /tmp/patch.py
          python3 /tmp/patch.py
      - name: Remove temporary workflow
        run: rm .github/workflows/patch-play-update-watcher.yml
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add automatic Google Play update watcher"
          git push origin HEAD:feat/play-update-watcher
