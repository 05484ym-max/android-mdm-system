name: Verify admin CSRF same-origin guard

on:
  push:
    branches:
      - fix/admin-csrf-same-origin

permissions:
  contents: write

jobs:
  patch-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply CSRF patch
        run: python tools/patch-admin-csrf-same-origin.py
      - name: Verify backend syntax and markers
        run: |
          node --check backend/index.js
          grep -F "const SAFE_ADMIN_METHODS = new Set(['GET', 'HEAD', 'OPTIONS']);" backend/index.js
          grep -F "cross-site admin request rejected" backend/index.js
          grep -F "new URL(origin).origin === expectedOrigin" backend/index.js
      - name: Commit production change only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/index.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Reject cross-site admin mutations'
          git push
