name: Verify WhatsApp accessibility reliable v3

on:
  push:
    branches:
      - fix/whatsapp-accessibility-reliable-v3

permissions:
  contents: write

jobs:
  patch-build-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-34' 'build-tools;34.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Apply accessibility patch
        run: python tools/patch-accessibility-reliable-v3.py
      - name: Build DPC
        working-directory: dpc-app
        run: gradle assembleDebug --stacktrace
      - name: Verify accessibility markers
        run: |
          FILE=dpc-app/app/src/main/java/org/mdmopen/dpc/CustomerActivity.kt
          grep -F 'Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS).setPackage("com.android.settings")' "$FILE"
          grep -F 'window.decorView.postDelayed' "$FILE"
          grep -F 'com.android.settings.Settings\$AccessibilitySettingsActivity' "$FILE"
      - name: Commit production change only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dpc-app/app/src/main/java/org/mdmopen/dpc/CustomerActivity.kt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Make WhatsApp accessibility settings launch reliable on Samsung'
          git push
