name: Patch News Live Preview
on:
  push:
    branches: [feat/news-live-preview]
    paths: ['.github/workflows/patch-news-live-preview.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/news-live-preview
      - name: Patch live preview
        run: |
          python3 - <<'PY'
          from pathlib import Path

          js = Path('admin-panel/news.js')
          s = js.read_text()
          s = s.replace("  const bubbleWidthNumber = document.getElementById('newsBubbleWidthNumber');\n", "  const bubbleWidthNumber = document.getElementById('newsBubbleWidthNumber');\n  const mediaField = mediaInput && mediaInput.closest('.news-media-field');\n")
          anchor = "  const clampBubbleWidth = value => Math.max(55, Math.min(100, Number.parseInt(value, 10) || 88));\n"
          insert = """  const clampBubbleWidth = value => Math.max(55, Math.min(100, Number.parseInt(value, 10) || 88));

  const livePreview = document.createElement('div');
  livePreview.className = 'news-live-preview';
  livePreview.innerHTML = `
    <div class="news-live-preview-label">תצוגה מקדימה ללקוח</div>
    <div class="news-live-preview-stage">
      <div class="news-live-bubble" id="newsLiveBubble">
        <div class="news-live-title" id="newsLiveTitle">כותרת ההודעה</div>
        <div class="news-live-body" id="newsLiveBody">תוכן ההודעה יופיע כאן בזמן ההקלדה</div>
        <div class="news-live-media" id="newsLiveMedia"></div>
      </div>
    </div>`;
  if (mediaField) mediaField.insertAdjacentElement('afterend', livePreview);
  const liveBubble = document.getElementById('newsLiveBubble');
  const liveTitle = document.getElementById('newsLiveTitle');
  const liveBody = document.getElementById('newsLiveBody');
  const liveMedia = document.getElementById('newsLiveMedia');

  function currentPreviewMedia() {
    const file = mediaInput.files && mediaInput.files[0];
    if (file && localPreviewUrl) return { type: selectedMediaKind(file), url: localPreviewUrl };
    if (removeMediaInput.checked) return null;
    if (editingItem && editingItem.mediaUrl) return { type: editingItem.mediaType, url: editingItem.mediaUrl };
    return null;
  }

  function renderLivePreview() {
    if (!liveBubble || !liveTitle || !liveBody || !liveMedia) return;
    liveBubble.style.width = `${clampBubbleWidth(bubbleWidthNumber.value)}%`;
    const title = titleInput.value.trim();
    const body = bodyInput.value.trim();
    liveTitle.textContent = title || 'כותרת ההודעה';
    liveTitle.classList.toggle('placeholder', !title);
    liveBody.textContent = body || 'תוכן ההודעה יופיע כאן בזמן ההקלדה';
    liveBody.classList.toggle('placeholder', !body);
    const media = currentPreviewMedia();
    liveMedia.innerHTML = media ? mediaMarkup(media.type, media.url, true) : '';
    liveMedia.style.display = media ? '' : 'none';
  }
"""
          if anchor not in s: raise SystemExit('news.js anchor missing')
          s = s.replace(anchor, insert, 1)
          s = s.replace("    applyBubblePreviewWidth(width);\n  }", "    applyBubblePreviewWidth(width);\n    renderLivePreview();\n  }", 1)
          s = s.replace("    mediaPreview.innerHTML = `<div class=\"news-media-selected\">נבחר: ${esc(file.name)}</div>` + mediaMarkup(type, localPreviewUrl); mediaPreview.style.display = '';\n", "    mediaPreview.innerHTML = mediaMarkup(type, localPreviewUrl); mediaPreview.style.display = '';\n    renderLivePreview();\n")
          s = s.replace("    else showFormMediaPreview(editingItem);\n  });\n", "    else showFormMediaPreview(editingItem);\n    renderLivePreview();\n  });\n", 1)
          s = s.replace("      applyBubblePreviewWidth(numeric);\n", "      applyBubblePreviewWidth(numeric);\n      renderLivePreview();\n")
          s = s.replace("  bubbleWidthNumber.addEventListener('change', () => setBubbleWidth(bubbleWidthNumber.value));\n", "  bubbleWidthNumber.addEventListener('change', () => setBubbleWidth(bubbleWidthNumber.value));\n  titleInput.addEventListener('input', renderLivePreview);\n  bodyInput.addEventListener('input', renderLivePreview);\n")
          s = s.replace("    formTitle.textContent = 'הודעה חדשה'; saveBtn.textContent = 'שלח ללקוחות'; cancelEditBtn.style.display = 'none'; formError.textContent = '';\n", "    formTitle.textContent = 'הודעה חדשה'; saveBtn.textContent = 'שלח ללקוחות'; cancelEditBtn.style.display = 'none'; formError.textContent = ''; renderLivePreview();\n")
          s = s.replace("    titleInput.scrollIntoView({behavior:'smooth',block:'center'});\n", "    renderLivePreview();\n    titleInput.scrollIntoView({behavior:'smooth',block:'center'});\n")
          s = s.replace("  setBubbleWidth(88);\n})();\n", "  setBubbleWidth(88);\n  renderLivePreview();\n})();\n")
          js.write_text(s)

          css = Path('admin-panel/news.css')
          c = css.read_text() + '''\n\n/* Live customer-style preview in the admin composer. */\n.news-live-preview { margin:12px 0 16px; padding:12px; border:1px solid var(--card-border); border-radius:16px; background:var(--bg); }\n.news-live-preview-label { font-size:.8rem; font-weight:800; color:var(--text-dim); margin-bottom:10px; }\n.news-live-preview-stage { width:100%; min-height:120px; padding:10px; border-radius:14px; background:#ecebe2; display:flex; justify-content:flex-start; align-items:flex-start; direction:rtl; }\n.news-live-bubble { width:88%; margin-inline-start:auto; background:var(--card-bg); border:1px solid var(--card-border); border-radius:16px; padding:14px; box-shadow:0 2px 10px rgba(0,0,0,.04); transition:width .12s ease; overflow:hidden; }\n.news-live-title { font-size:.98rem; font-weight:800; color:var(--text); overflow-wrap:anywhere; }\n.news-live-body { margin-top:7px; color:var(--text); font-size:.88rem; line-height:1.5; white-space:pre-wrap; overflow-wrap:anywhere; }\n.news-live-title.placeholder,.news-live-body.placeholder { color:var(--text-dim); }\n.news-live-media { margin-top:10px; overflow:hidden; border-radius:11px; }\n.news-live-media img { display:block; width:100%; max-height:360px; object-fit:contain; border-radius:10px; }\n.news-live-media video { display:block; width:100%; max-height:360px; border-radius:10px; background:#111; }\n.news-media-preview .news-media-selected { display:none; }\n'''
          css.write_text(c)

          test = Path('backend/test-news-live-preview-static.js')
          test.write_text("""const fs = require('fs');\nconst assert = require('assert');\nconst js = fs.readFileSync('../admin-panel/news.js', 'utf8');\nconst css = fs.readFileSync('../admin-panel/news.css', 'utf8');\nassert(js.includes('news-live-preview'));\nassert(js.includes('function renderLivePreview()'));\nassert(js.includes(\"titleInput.addEventListener('input', renderLivePreview)\"));\nassert(js.includes(\"bodyInput.addEventListener('input', renderLivePreview)\"));\nassert(js.includes('liveBubble.style.width'));\nassert(js.includes('currentPreviewMedia()'));\nassert(css.includes('.news-live-bubble'));\nassert(css.includes('.news-live-media img'));\nconsole.log('news live preview wiring: ok');\n""")

          pkg = Path('backend/package.json')
          p = pkg.read_text()
          if 'test-news-live-preview-static.js' not in p:
              p = p.replace('node test-play-update-watcher-static.js', 'node test-play-update-watcher-static.js && node test-news-live-preview-static.js')
          pkg.write_text(p)
          PY
      - name: Static checks
        working-directory: backend
        run: npm test
      - name: Commit patch and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/patch-news-live-preview.yml
          git add -A
          git commit -m 'Add live news message preview in admin panel'
          git push origin HEAD:feat/news-live-preview
