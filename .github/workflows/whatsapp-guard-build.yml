name: WhatsApp Guard Build

on:
  push:
    paths:
      - 'whatsapp-guard-app/**'
      - '.github/workflows/whatsapp-guard-build.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'whatsapp-guard-app/**'
      - '.github/workflows/whatsapp-guard-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android platform
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build standalone WhatsApp Guard APK
        run: gradle -p whatsapp-guard-app :app:assembleDebug --stacktrace
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: whatsapp-guard-debug
          path: whatsapp-guard-app/app/build/outputs/apk/debug/app-debug.apk
