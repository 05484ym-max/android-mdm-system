name: Run Customer Profile Patch
on:
  push:
    branches:
      - feat/customer-profile-app-catalog-polish
    paths:
      - scripts/patch_customer_profile.py
      - scripts/run_customer_profile_patch.trigger
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/customer-profile-app-catalog-polish
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Adjust guarded duplicate mapping
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/patch_customer_profile.py')
          s=p.read_text()
          marker="def rx(path, pattern, repl, label, flags=re.S):"
          helper="""def repn(path, old, new, label, expected):
    p = Path(path)
    s = p.read_text()
    c = s.count(old)
    if c != expected:
        raise SystemExit(f'{label}: expected {expected} matches, got {c}')
    p.write_text(s.replace(old, new))


"""
          if marker not in s: raise SystemExit('rx marker missing')
          s=s.replace(marker, helper+marker, 1)
          needle="rep('backend/db.js', '''    customerName: row.customer_name,\n    customerNumber: row.customer_number,''',"
          if s.count(needle)!=1: raise SystemExit(f'db mapping call marker count={s.count(needle)}')
          s=s.replace(needle, "repn('backend/db.js', '''    customerName: row.customer_name,\n    customerNumber: row.customer_number,''',", 1)
          tail="'toDevice profile mapping')"
          pos=s.find(tail, s.find("repn('backend/db.js'"))
          if pos < 0: raise SystemExit('db mapping call tail missing')
          s=s[:pos]+"'customer profile mappings', 2)"+s[pos+len(tail):]
          p.write_text(s)
          PY
      - name: Apply patch
        run: python3 scripts/patch_customer_profile.py
      - name: Verify JavaScript and admin contracts
        run: |
          node --check backend/index.js
          node --check backend/db.js
          node --check backend/playStoreSearch.js
          for f in admin-panel/*.js; do node --check "$f"; done
          cd backend
          node test-admin-panel-functional-audit.js
      - name: Verify Android
        working-directory: dpc-app
        run: gradle testDebugUnitTest --no-daemon
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/run-customer-profile-patch.yml scripts/patch_customer_profile.py scripts/run_customer_profile_patch.trigger
          git add admin-panel backend dpc-app
          git diff --cached --check
          git commit -m "Polish customer profile and expand Play search"
          git push origin HEAD:feat/customer-profile-app-catalog-polish
