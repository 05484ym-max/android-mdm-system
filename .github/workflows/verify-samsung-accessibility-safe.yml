name: Verify Samsung accessibility safe launch

on:
  push:
    branches: [ fix/samsung-accessibility-settings-crash ]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Apply safe accessibility patch
        run: python3 tools/patch-samsung-accessibility-safe.py
      - name: Build DPC
        working-directory: dpc-app
        run: gradle assembleDebug --stacktrace
      - name: Verify no private Samsung Settings classes remain in launcher function
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text = Path('dpc-app/app/src/main/java/org/mdmopen/dpc/CustomerActivity.kt').read_text()
          start = text.index('private fun openWhatsAppAccessibilitySettings()')
          end = text.index('private fun compactPersonalIdentityCard()', start)
          fn = text[start:end]
          assert 'com.samsung.android.settings.accessibility.AccessibilitySettingsActivity' not in fn
          assert 'Settings\\$AccessibilitySettingsActivity' not in fn
          assert 'Settings.ACTION_ACCESSIBILITY_SETTINGS' in fn
          assert 'resolveActivity(packageManager)' in fn
          print('safe accessibility launcher verified')
          PY
      - name: Commit production change only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dpc-app/app/src/main/java/org/mdmopen/dpc/CustomerActivity.kt
          if git diff --cached --quiet; then
            echo "No production change"
            exit 0
          fi
          git commit -m "Avoid crashing Samsung Settings from accessibility launch"
          git push
