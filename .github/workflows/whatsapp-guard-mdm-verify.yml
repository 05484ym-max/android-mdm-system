name: WhatsApp Guard MDM Verify

on:
  pull_request:
    paths:
      - 'dpc-app/**'
      - '.github/workflows/whatsapp-guard-mdm-verify.yml'
  push:
    branches: [ main ]
    paths:
      - 'dpc-app/**'
      - '.github/workflows/whatsapp-guard-mdm-verify.yml'
  workflow_dispatch:

jobs:
  verify-whatsapp-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK packages
        run: |
          SDKMANAGER=/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-34" "build-tools;34.0.0"
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: 8.9

      - name: Compile DPC and run unit tests
        working-directory: dpc-app
        run: gradle --no-daemon testDebugUnitTest assembleDebug

      - name: Verify WhatsApp guard production invariants
        run: |
          python3 - <<'PY'
          from pathlib import Path

          base = Path('dpc-app/app/src/main/java/org/mdmopen/dpc')
          engine = (base / 'WhatsAppGuardEngine.kt').read_text()
          blocked = (base / 'WhatsAppBlockedActivity.kt').read_text()
          service = (base / 'WhatsAppGuardService.kt').read_text()
          policy = (base / 'WhatsAppGuardPolicy.kt').read_text()
          matcher = (base / 'WhatsAppGuardTerms.kt').read_text()
          enforcer = (base / 'PolicyEnforcer.kt').read_text()
          customer = (base / 'CustomerActivity.kt').read_text()
          calibration = (base / 'WhatsAppMaskCalibration.kt').read_text()
          calibration_ui = (base / 'WhatsAppMaskCalibrationActivity.kt').read_text()
          calibration_launcher = (base / 'WhatsAppMaskCalibrationLauncherActivity.kt').read_text()
          manifest = Path('dpc-app/app/src/main/AndroidManifest.xml').read_text()
          xml = Path('dpc-app/app/src/main/res/xml/whatsapp_guard_accessibility.xml').read_text()

          checks = {
              'service observes WhatsApp and managed accessibility settings': all(x in xml for x in ['com.whatsapp', 'com.android.settings', 'com.samsung.accessibility']),
              'window topology events observed': 'typeWindowsChanged' in xml,
              'updates tab click blocked before engine': 'shouldBlockUpdatesClick(event, policy)' in service and 'blockUpdatesNavigation()' in service and 'WhatsAppGuardTerms.isUpdates(text, id)' in service,
              'updates block uses global back': 'performGlobalAction(GLOBAL_ACTION_BACK)' in service,
              'updates blocked screen kind exists': 'KIND_UPDATES' in blocked and 'העדכונים חסומים' in blocked,
              'status click eject fallback exists': 'val statusTarget = policy.blockStatuses && signals.any' in engine and 'ejectBack(WhatsAppBlockedActivity.KIND_STATUS)' in engine,
              'channel click eject fallback exists': 'val channelTarget = policy.blockChannels && signals.any' in engine and 'ejectBack(WhatsAppBlockedActivity.KIND_CHANNEL)' in engine,
              'blocked activity registered private': 'android:name=".WhatsAppBlockedActivity"' in manifest and 'android:exported="false"' in manifest,
              'blocked screen returns to WhatsApp': 'getLaunchIntentForPackage(WHATSAPP_PACKAGE)' in blocked and 'חזרה ל-WhatsApp' in blocked,
              'blocked screen remains fail-open after back': 'catch (_: Exception)' in service and 'startActivity(intent)' in service,
              'click matching stays local': 'private fun clickSignals(event: AccessibilityEvent)' in engine and 'addDescendants(source, 2)' in engine,
              'internal status/channel matcher does not confuse Updates': all(x in engine for x in [
                  '!WhatsAppGuardTerms.isUpdates(text, id)',
                  'WhatsAppGuardTerms.isStatus(text, id)',
                  'WhatsAppGuardTerms.isChannel(text, id)',
              ]),
              'no whole-updates screen classifier eject': 'screen == WhatsAppScreen.UPDATES) {' not in engine,
              'avatar masking uses saved calibration': 'WhatsAppMaskCalibrationStore.targetFor(screen)' in engine and 'WhatsAppMaskCalibrationStore.get(service, target)' in engine,
              'no automatic row/image fallback': 'maskAvatarAreasPerChatRow' not in engine and 'imageCandidates' not in engine,
              'calibration stored as normalized ratios': 'NormalizedMaskRect' in calibration and 'screen.width() * n.left' in calibration and 'screen.height() * n.top' in calibration,
              'calibration is orientation-specific': 'ORIENTATION_LANDSCAPE' in calibration and 'portrait' in calibration,
              'all WhatsApp mask targets exist': all(x in calibration for x in ['CHAT_LIST', 'CONTACT_PICKER', 'CHAT_HEADER', 'CONTACT_INFO']),
              'calibration overlay is draggable and resizable': 'MaskEditorView' in calibration_ui and 'DragMode.MOVE' in calibration_ui and 'DragMode.LEFT' in calibration_ui and 'DragMode.RIGHT' in calibration_ui,
              'calibration save reset cancel controls exist': all(x in calibration_ui for x in ['שמור', 'איפוס', 'ביטול']),
              'calibration launcher requires admin pin': 'Config.checkAdminPin' in calibration_launcher and 'Config.hasAdminPin' in calibration_launcher,
              'calibration has no separate launcher icon': 'android:name=".WhatsAppMaskCalibrationLauncherActivity"' in manifest and '<category android:name="android.intent.category.LAUNCHER"' not in manifest.split('WhatsAppMaskCalibrationLauncherActivity',1)[1].split('</activity>',1)[0],
              'calibration launcher registered private': 'android:name=".WhatsAppMaskCalibrationLauncherActivity"' in manifest and 'android:exported="false"' in manifest.split('WhatsAppMaskCalibrationLauncherActivity',1)[1].split('/>',1)[0],
              'calibration accessible from customer personal area': 'כיול תמונות פרופיל' in customer and 'WhatsAppMaskCalibrationLauncherActivity::class.java' in customer,
              'installer accessibility setup requires admin pin': 'requestAdminPinForWhatsApp' in customer and 'Config.checkAdminPin' in customer and 'openWhatsAppAccessibilitySettings()' in customer,
              'status and channels remain panel-only on device UI': 'חסימת סטטוסים וערוצים אינה ניתנת לשינוי במכשיר' in customer,
              'managed accessibility settings eject exists': 'shouldEjectManagedAccessibilitySettings' in service and 'ejectManagedAccessibilitySettings' in service and 'SETTINGS_EJECT_DEBOUNCE_MS' in service,
              'installer setup window bypasses settings eject': 'Config.accessibilitySetupWindowActive(this)' in service,
              'settings eject does not block WhatsApp fail-open path': 'if (!policy.enabled) return false' in service and 'ACCESSIBILITY_LOST_OPEN' in policy and 'setGuardSuspended(context, dpm, admin, false)' in policy,
              'global back ejection used for status/channel': 'performGlobalAction(AccessibilityService.GLOBAL_ACTION_BACK)' in engine,
              'no status/channel overlay fallback': 'Status/Channels intentionally have no overlay fallback' in engine,
              'eject debounce exists': 'EJECT_DEBOUNCE_MS' in engine and 'UPDATES_EJECT_DEBOUNCE_MS' in service,
              'view-id fallback exists': 'viewIdResourceName' in engine and 'idTokens' in matcher,
              'render root verified as WhatsApp': 'root?.packageName?.toString() != WHATSAPP_PACKAGE' in service,
              'service re-locks managed accessibility': 'allowManagedAccessibilityService()' in service,
              'device owner required by guard protection': 'isDeviceOwnerApp' in policy,
              'first setup keeps Samsung accessibility visible': 'FIRST_SETUP_PENDING' in policy and 'setSamsungAccessibilitySettingsVisible(context, dpm, admin, true)' in policy,
              'protected state hides Samsung accessibility settings': 'PROTECTED' in policy and 'setSamsungAccessibilitySettingsVisible(context, dpm, admin, false)' in policy,
              'Samsung accessibility remains essential during setup': 'com.samsung.accessibility' in enforcer and 'essential += samsungAccessibilityPackage' in enforcer,
              'post-setup accessibility loss fails open': 'ACCESSIBILITY_LOST_OPEN' in policy and 'setGuardSuspended(context, dpm, admin, false)' in policy,
              'legacy fail-closed accessibility state removed': 'ACCESSIBILITY_LOST_BLOCK' not in policy and 'ACCESSIBILITY_LOST_BLOCKED' not in policy,
              'first setup remains separately modeled': 'FIRST_SETUP_PENDING' in policy,
          }
          failed = [name for name, ok in checks.items() if not ok]
          for name, ok in checks.items():
              print(('OK   ' if ok else 'FAIL ') + name)
          if failed:
              raise SystemExit('WhatsApp guard invariant failure: ' + ', '.join(failed))
          PY
