name: Verify MDM WhatsApp Guard

on:
  push:
    branches: [ feature/whatsapp-guard-mdm ]
    paths:
      - 'dpc-app/**'
      - '.github/workflows/whatsapp-guard-mdm-verify.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install SDK packages
        run: sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Compile DPC debug APK
        working-directory: dpc-app
        run: gradle assembleDebug --stacktrace
