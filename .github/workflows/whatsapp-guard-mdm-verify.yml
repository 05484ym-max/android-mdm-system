name: WhatsApp Guard MDM Verify

on:
  pull_request:
    paths:
      - 'dpc-app/**'
      - '.github/workflows/whatsapp-guard-mdm-verify.yml'
  push:
    branches: [ main ]
    paths:
      - 'dpc-app/**'
      - '.github/workflows/whatsapp-guard-mdm-verify.yml'
  workflow_dispatch:

jobs:
  verify-whatsapp-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Compile DPC and run unit tests
        working-directory: dpc-app
        run: gradle --no-daemon testDebugUnitTest assembleDebug

      - name: Verify WhatsApp guard production invariants
        run: |
          python3 - <<'PY'
          from pathlib import Path

          base = Path('dpc-app/app/src/main/java/org/mdmopen/dpc')
          engine = (base / 'WhatsAppGuardEngine.kt').read_text()
          service = (base / 'WhatsAppGuardService.kt').read_text()
          policy = (base / 'WhatsAppGuardPolicy.kt').read_text()
          matcher = (base / 'WhatsAppGuardTerms.kt').read_text()
          enforcer = (base / 'PolicyEnforcer.kt').read_text()
          xml = Path('dpc-app/app/src/main/res/xml/whatsapp_guard_accessibility.xml').read_text()

          checks = {
              'service scoped to WhatsApp package': 'android:packageNames="com.whatsapp"' in xml,
              'window topology events observed': 'typeWindowsChanged' in xml,
              'status click eject exists': 'val statusTarget = policy.blockStatuses && signals.any' in engine and 'if (statusTarget) return ejectBack()' in engine,
              'channel click eject exists': 'val channelTarget = policy.blockChannels && signals.any' in engine and 'if (channelTarget) return ejectBack()' in engine,
              'click matching stays local': 'private fun clickSignals(event: AccessibilityEvent)' in engine and 'addDescendants(source, 2)' in engine,
              'updates navigation is exempt per signal': '!WhatsAppGuardTerms.isUpdates(text, id) && WhatsAppGuardTerms.isStatus' in engine and '!WhatsAppGuardTerms.isUpdates(text, id) && WhatsAppGuardTerms.isChannel' in engine,
              'no whole-updates screen eject': 'screen == WhatsAppScreen.UPDATES) {' not in engine,
              'no updates click eject': 'policy.blockStatuses && policy.blockChannels && WhatsAppGuardTerms.isUpdates' not in engine,
              'avatar mask is narrow cut rail': 'private fun maskAvatarCutRail' in engine and 'val width = dp(if (picker) 20 else 22)' in engine,
              'global back ejection used': 'performGlobalAction(AccessibilityService.GLOBAL_ACTION_BACK)' in engine,
              'no status/channel overlay fallback': 'Status/Channels intentionally have no overlay fallback' in engine,
              'eject debounce exists': 'EJECT_DEBOUNCE_MS' in engine,
              'view-id fallback exists': 'viewIdResourceName' in engine and 'idTokens' in matcher,
              'render root verified as WhatsApp': 'root?.packageName?.toString() != WHATSAPP_PACKAGE' in service,
              'service re-locks managed accessibility': 'allowManagedAccessibilityService()' in service,
              'device owner required by guard protection': 'isDeviceOwnerApp' in policy,
              'first setup keeps Samsung accessibility visible': 'FIRST_SETUP_PENDING' in policy and 'setSamsungAccessibilitySettingsVisible(context, dpm, admin, true)' in policy,
              'protected state hides Samsung accessibility settings': 'PROTECTED' in policy and 'setSamsungAccessibilitySettingsVisible(context, dpm, admin, false)' in policy,
              'Samsung accessibility remains essential during setup': 'com.samsung.accessibility' in enforcer and 'essential += samsungAccessibilityPackage' in enforcer,
              'post-setup accessibility loss fails open': 'ACCESSIBILITY_LOST_OPEN' in policy and 'setGuardSuspended(context, dpm, admin, false)' in policy,
              'legacy fail-closed accessibility state removed': 'ACCESSIBILITY_LOST_BLOCK' not in policy and 'ACCESSIBILITY_LOST_BLOCKED' not in policy,
              'first setup remains separately modeled': 'FIRST_SETUP_PENDING' in policy,
          }
          failed = [name for name, ok in checks.items() if not ok]
          for name, ok in checks.items():
              print(('OK   ' if ok else 'FAIL ') + name)
          if failed:
              raise SystemExit('WhatsApp guard invariant failure: ' + ', '.join(failed))
          PY
