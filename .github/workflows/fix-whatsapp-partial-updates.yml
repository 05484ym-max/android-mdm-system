name: Fix WhatsApp Partial Updates
on:
  push:
    branches:
      - fix/whatsapp-partial-updates
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/whatsapp-partial-updates
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Apply guarded fix
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('dpc-app/app/src/main/java/org/mdmopen/dpc/WhatsAppGuardService.kt')
          s=p.read_text()
          old='''    private fun shouldBlockUpdatesClick(event: AccessibilityEvent, policy: WhatsAppGuardPolicy): Boolean {\n        if (!policy.enabled || (!policy.blockStatuses && !policy.blockChannels)) return false\n'''
          new='''    private fun shouldBlockUpdatesClick(event: AccessibilityEvent, policy: WhatsAppGuardPolicy): Boolean {\n        // Only block the whole Updates tab when BOTH content families are blocked.\n        // With a partial policy (statuses-only or channels-only), Updates must stay\n        // reachable and WhatsAppGuardEngine blocks only the matching cards/section.\n        // This is especially important on fresh WhatsApp installs that have no\n        // statuses yet: channels-only must not make the entire Updates tab unusable.\n        if (!policy.enabled || !policy.blockStatuses || !policy.blockChannels) return false\n'''
          if s.count(old) != 1:
              raise SystemExit('guard mismatch')
          p.write_text(s.replace(old,new))
          PY
          grep -Fq '!policy.blockStatuses || !policy.blockChannels' dpc-app/app/src/main/java/org/mdmopen/dpc/WhatsAppGuardService.kt
          grep -Fq 'policy.blockChannels && signals.any' dpc-app/app/src/main/java/org/mdmopen/dpc/WhatsAppGuardEngine.kt
          grep -Fq 'policy.blockStatuses && signals.any' dpc-app/app/src/main/java/org/mdmopen/dpc/WhatsAppGuardEngine.kt
      - name: Android tests
        working-directory: dpc-app
        run: gradle testDebugUnitTest --no-daemon
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/fix-whatsapp-partial-updates.yml
          git add dpc-app/app/src/main/java/org/mdmopen/dpc/WhatsAppGuardService.kt
          git diff --cached --check
          git commit -m "Allow partial WhatsApp Updates access"
          git push origin HEAD:fix/whatsapp-partial-updates
