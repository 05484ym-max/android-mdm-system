name: WhatsApp accessibility setup fix

on:
  push:
    branches:
      - fix/whatsapp-accessibility-setup

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/whatsapp-accessibility-setup
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Apply patch
        working-directory: dpc-app
        run: python3 patch_whatsapp_accessibility.py
      - name: Build DPC
        working-directory: dpc-app
        run: gradle assembleDebug --stacktrace
      - name: Commit verified fix
        run: |
          rm dpc-app/patch_whatsapp_accessibility.py
          rm .github/workflows/whatsapp-accessibility-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix WhatsApp Guard accessibility setup flow"
          git push origin HEAD:fix/whatsapp-accessibility-setup
