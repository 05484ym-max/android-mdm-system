      - name: Build DPC debug APK
        working-directory: dpc-app
        run: gradle assembleDebug --stacktrace
      - name: Commit verified fix and remove temporary workflow
        run: |
          set -e
          rm .github/workflows/whatsapp-accessibility-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix WhatsApp Guard accessibility setup flow'
          git push origin HEAD:fix/whatsapp-accessibility-setup
