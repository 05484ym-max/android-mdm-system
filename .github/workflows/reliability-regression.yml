name: Reliability Regression

on:
  pull_request:
    paths:
      - 'backend/**'
      - 'ai-service/**'
      - 'dpc-app/app/src/main/java/org/mdmopen/dpc/**'
      - 'dpc-app/app/src/main/AndroidManifest.xml'
      - 'dpc-app/app/build.gradle.kts'
      - '.github/workflows/build-dpc.yml'
      - '.github/workflows/reliability-regression.yml'
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'ai-service/**'
      - 'dpc-app/app/src/main/java/org/mdmopen/dpc/**'
      - 'dpc-app/app/src/main/AndroidManifest.xml'
      - 'dpc-app/app/build.gradle.kts'
      - '.github/workflows/build-dpc.yml'
      - '.github/workflows/reliability-regression.yml'

permissions:
  contents: read

jobs:
  backend-syntax-and-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci
      - name: Run backend syntax gate
        working-directory: backend
        run: npm test
      - name: Verify production reliability contracts
        run: |
          set -euo pipefail
          grep -q 'lease_expires_at' backend/reliabilityBridge.js
          grep -q 'FOR UPDATE SKIP LOCKED' backend/reliabilityBridge.js
          grep -q 'AND completed_at IS NULL' backend/reliabilityBridge.js
          grep -q 'function ensureReady()' backend/reliabilityBridge.js
          grep -q 'registerDeviceIdempotent' backend/reliabilityBridge.js
          grep -q 'registerDeviceIdempotent' backend/index.js
          grep -q 'enrollment_attempts' backend/reliabilityBridge.js
          grep -q 'IMAGE_CACHE_RETENTION_DAYS' backend/reliabilityBridge.js
          grep -q 'PUBLIC_RATE_MAP_MAX_ENTRIES = 4096' backend/index.js
          grep -q 'prunePublicRateMap(browserClassifierRate' backend/index.js
          grep -q 'prunePublicRateMap(imageProxyRate' backend/index.js
          grep -q 'hasPushToken' backend/reliabilityBridge.js
          grep -q 'token_unregistered' backend/push.js
          grep -q 'installUploadMemoryGuard' backend/universalEntry.js

  android-reliability-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify durable command and scheduler contracts
        run: |
          set -euo pipefail
          SRC=dpc-app/app/src/main/java/org/mdmopen/dpc
          grep -q 'object CommandJournal' "$SRC/CommandJournal.kt"
          grep -q 'startedAt' "$SRC/CommandJournal.kt"
          grep -q 'Settings.Global.BOOT_COUNT' "$SRC/PolicySync.kt"
          grep -q 'PACKAGE_ATTEMPT_TIMEOUT_MS' "$SRC/PolicySync.kt"
          grep -q 'EXTRA_COMMAND_ATTEMPT_ID' "$SRC/AppInstaller.kt"
          grep -q 'Ignoring stale package callback' "$SRC/InstallResultReceiver.kt"
          grep -q 'requestCode(commandId, attemptId' "$SRC/AppInstaller.kt"
          grep -q 'ManagedInstallWindow.open' "$SRC/PlayStoreGate.kt"
          if grep -qE 'clearUserRestriction\(|addUserRestriction\(' "$SRC/PlayStoreGate.kt"; then
            echo 'PlayStoreGate must not mutate install restrictions directly' >&2
            exit 1
          fi
          grep -q 'setDesiredInstallBlocked' "$SRC/PolicySync.kt"
          grep -q 'private val commandLock' "$SRC/PolicySync.kt"
          grep -q 'MAX_APK_BYTES' "$SRC/AppInstaller.kt"
          grep -q 'MAX_UPDATE_APK_BYTES' "$SRC/AutoUpdater.kt"
          grep -q 'runGeneration' "$SRC/UpdateCheckJobService.kt"
          grep -q 'runGeneration' "$SRC/DnsFailSafeJobService.kt"
          grep -q 'runningTask?.cancel(true)' "$SRC/DnsFailSafeJobService.kt"
          grep -q 'future.cancel(true)' "$SRC/AdBlockDns.kt"
          grep -q 'registerPushToken' "$SRC/PushRegistration.kt"
          if grep -q 'pushToken == Config.pushToken' "$SRC/PushRegistration.kt"; then
            echo 'PushRegistration must reassert the current token after server-side pruning' >&2
            exit 1
          fi

      - name: Verify Android 16 provisioning contracts
        run: |
          set -euo pipefail
          SRC=dpc-app/app/src/main/java/org/mdmopen/dpc
          MANIFEST=dpc-app/app/src/main/AndroidManifest.xml
          GRADLE=dpc-app/app/build.gradle.kts
          BUILD=.github/workflows/build-dpc.yml
          grep -q 'compileSdk = 36' "$GRADLE"
          grep -q 'platforms;android-36' "$BUILD"
          grep -q 'ACTION_GET_PROVISIONING_MODE' "$SRC/ProvisioningActivity.kt"
          grep -q 'ACTION_ADMIN_POLICY_COMPLIANCE' "$SRC/ProvisioningActivity.kt"
          grep -q 'ACTION_PROVISIONING_SUCCESSFUL' "$SRC/ProvisioningSuccessActivity.kt"
          grep -q 'android.app.action.PROVISIONING_SUCCESSFUL' "$MANIFEST"
          grep -q 'android.app.action.PROFILE_PROVISIONING_COMPLETE' "$MANIFEST"
          grep -q 'android.app.action.DEVICE_OWNER_CHANGED' "$MANIFEST"
          grep -q 'PROVISIONING_DEVICE_ADMIN_SIGNATURE_CHECKSUM' "$BUILD"
          if grep -q 'PROVISIONING_DEVICE_ADMIN_PACKAGE_CHECKSUM' "$BUILD"; then
            echo 'Provisioning QR must use exactly one integrity mechanism: signature checksum only' >&2
            exit 1
          fi
          grep -q 'mdm.apk?v=' "$BUILD"
          if grep -qE 'ApiClient\(|PolicySync\.run\(|Thread\(' "$SRC/ProvisioningActivity.kt"; then
            echo 'ProvisioningActivity must not block Setup Wizard with network/policy work' >&2
            exit 1
          fi

  ai-memory-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify bounded AI request admission
        run: |
          set -euo pipefail
          python3 -m py_compile ai-service/app.py ai-service/policy.py
          grep -q '_request_gate = asyncio.Semaphore' ai-service/app.py
          grep -q 'async def _read_bounded_body' ai-service/app.py
          grep -q 'async for chunk in request.stream()' ai-service/app.py
          grep -q 'async with _request_gate' ai-service/app.py
