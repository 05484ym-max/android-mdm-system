name: Apply News Bubble Width Patch

on:
  push:
    branches:
      - feat/news-bubble-width-control
    paths:
      - tools/apply_news_bubble_width_patch.py
      - .github/workflows/apply-news-bubble-width-patch.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/news-bubble-width-control
      - name: Apply patch
        run: python tools/apply_news_bubble_width_patch.py
      - name: Verify syntax/static wiring
        run: |
          cd backend
          npm test
      - name: Commit patched sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend admin-panel dpc-app
          git commit -m "Add per-message news bubble width control"
          git push origin HEAD:feat/news-bubble-width-control
