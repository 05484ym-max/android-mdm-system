name: Verify accessibility relock failsafe

on:
  push:
    branches: [ fix/p0-store-accessibility-final-v2 ]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Apply failsafe patch
        run: python3 tools/patch-accessibility-failsafe.py
      - name: Build DPC
        working-directory: dpc-app
        run: gradle assembleDebug --stacktrace
      - name: Verify failsafe markers
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s = Path('dpc-app/app/src/main/java/org/mdmopen/dpc/SyncScheduler.kt').read_text()
          p = Path('dpc-app/app/src/main/java/org/mdmopen/dpc/PolicyEnforcer.kt').read_text()
          w = Path('dpc-app/app/src/main/java/org/mdmopen/dpc/AccessibilityRelockWorker.kt').read_text()
          assert 'UNIQUE_ACCESSIBILITY_RELOCK_WORK' in s
          assert 'setInitialDelay(8, TimeUnit.SECONDS)' in s
          assert 'AccessibilityRelockWorker' in s
          assert 'enqueueAccessibilityRelock(context)' in p
          assert 'allowManagedAccessibilityService()' in w
          print('Accessibility failsafe verified')
          PY
      - name: Commit production failsafe only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dpc-app/app/src/main/java/org/mdmopen/dpc/SyncScheduler.kt \
                  dpc-app/app/src/main/java/org/mdmopen/dpc/PolicyEnforcer.kt
          git commit -m "Add accessibility relock failsafe" || exit 0
          git push
