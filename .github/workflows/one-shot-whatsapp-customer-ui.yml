name: One-shot WhatsApp customer UI patch

on:
  push:
    branches:
      - fix/comprehensive-mdm-hardening
    paths:
      - '.github/workflows/one-shot-whatsapp-customer-ui.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/comprehensive-mdm-hardening
          fetch-depth: 0

      - name: Integrate WhatsApp controls into customer personal area
        run: python3 .github/scripts/patch_customer_whatsapp.py

      - name: Remove temporary patch files and commit
        run: |
          rm .github/workflows/one-shot-whatsapp-customer-ui.yml
          rm .github/scripts/patch_customer_whatsapp.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dpc-app/app/src/main/java/org/mdmopen/dpc/CustomerActivity.kt .github/workflows/one-shot-whatsapp-customer-ui.yml .github/scripts/patch_customer_whatsapp.py
          git commit -m "Integrate WhatsApp setup and calibration into customer area"
          git push origin HEAD:fix/comprehensive-mdm-hardening
