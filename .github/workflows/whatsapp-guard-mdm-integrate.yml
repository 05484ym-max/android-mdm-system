name: Integrate MDM WhatsApp Guard

on:
  push:
    branches: [ feature/whatsapp-guard-mdm ]
    paths:
      - '.github/scripts/patch-whatsapp-guard-mdm.py'
      - '.github/workflows/whatsapp-guard-mdm-integrate.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/whatsapp-guard-mdm
          fetch-depth: 0
      - name: Apply integration patch
        run: python3 .github/scripts/patch-whatsapp-guard-mdm.py
      - name: Backend syntax
        run: node --check backend/index.js
      - name: Admin JavaScript syntax
        run: node --check admin-panel/customer-search.js
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install SDK packages
        run: sdkmanager 'platform-tools' 'platforms;android-34' 'build-tools;34.0.0'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Compile DPC
        working-directory: dpc-app
        run: gradle assembleDebug --stacktrace
      - name: Commit integrated code
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/index.js admin-panel/customer-search.js admin-panel/news.css dpc-app/app/src/main/java/org/mdmopen/dpc/ApiClient.kt dpc-app/app/src/main/java/org/mdmopen/dpc/PolicySync.kt
          if git diff --cached --quiet; then
            echo 'No integration changes to commit'
          else
            git commit -m 'Wire WhatsApp Guard policy through MDM and admin panel'
            git push origin HEAD:feature/whatsapp-guard-mdm
          fi
