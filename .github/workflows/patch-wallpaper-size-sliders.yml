name: Patch Wallpaper Size Sliders
on:
  push:
    branches: [feat/customer-wallpaper-branding-toggle]
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/customer-wallpaper-branding-toggle
      - name: Patch wallpaper size controls
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          wp = Path('dpc-app/app/src/main/java/org/mdmopen/dpc/WallpaperBranding.kt')
          s = wp.read_text()
          s = s.replace(
              '    private const val KEY_ENABLED = "customer_branding_enabled"\n',
              '    private const val KEY_ENABLED = "customer_branding_enabled"\n'
              '    private const val KEY_HOME_SIZE_PERCENT = "customer_branding_home_size_percent"\n'
              '    private const val KEY_LOCK_SIZE_PERCENT = "customer_branding_lock_size_percent"\n'
              '    const val MIN_SIZE_PERCENT = 10\n'
              '    const val MAX_SIZE_PERCENT = 75\n'
              '    const val DEFAULT_SIZE_PERCENT = 30\n'
          )
          marker = '''    fun isEnabled(context: Context): Boolean =
        context.getSharedPreferences(PREFS, Context.MODE_PRIVATE)
            .getBoolean(KEY_ENABLED, true)
'''
          insert = marker + '''
    fun homeSizePercent(context: Context): Int =
        context.getSharedPreferences(PREFS, Context.MODE_PRIVATE)
            .getInt(KEY_HOME_SIZE_PERCENT, DEFAULT_SIZE_PERCENT)
            .coerceIn(MIN_SIZE_PERCENT, MAX_SIZE_PERCENT)

    fun lockSizePercent(context: Context): Int =
        context.getSharedPreferences(PREFS, Context.MODE_PRIVATE)
            .getInt(KEY_LOCK_SIZE_PERCENT, DEFAULT_SIZE_PERCENT)
            .coerceIn(MIN_SIZE_PERCENT, MAX_SIZE_PERCENT)

    @Synchronized
    fun setSizePercents(context: Context, homePercent: Int, lockPercent: Int): String {
        val home = homePercent.coerceIn(MIN_SIZE_PERCENT, MAX_SIZE_PERCENT)
        val lock = lockPercent.coerceIn(MIN_SIZE_PERCENT, MAX_SIZE_PERCENT)
        context.getSharedPreferences(PREFS, Context.MODE_PRIVATE)
            .edit()
            .putInt(KEY_HOME_SIZE_PERCENT, home)
            .putInt(KEY_LOCK_SIZE_PERCENT, lock)
            .remove(KEY_RECIPE_VERSION)
            .commit()
        return if (isEnabled(context)) {
            apply(context)
        } else {
            "Android ${Build.VERSION.RELEASE} · גודל הסמל נשמר: בית $home% · נעילה $lock%"
        }
    }
'''
          if 'fun homeSizePercent(context: Context)' not in s:
              s = s.replace(marker, insert)

          s = s.replace(
              '            val brandedHome = compositeEmblem(homeOriginal, emblem)\n            val brandedLock = compositeEmblem(lockOriginal, emblem)\n',
              '            val brandedHome = compositeEmblem(homeOriginal, emblem, homeSizePercent(context) / 100f)\n'
              '            val brandedLock = compositeEmblem(lockOriginal, emblem, lockSizePercent(context) / 100f)\n'
          )
          s = s.replace(
              '    private fun compositeEmblem(background: Bitmap, emblem: Bitmap): CompositeResult {\n',
              '    private fun compositeEmblem(background: Bitmap, emblem: Bitmap, widthFraction: Float): CompositeResult {\n'
          )
          s = s.replace(
              '        val targetWidth = result.width * 0.30f\n',
              '        val targetWidth = result.width * widthFraction.coerceIn(MIN_SIZE_PERCENT / 100f, MAX_SIZE_PERCENT / 100f)\n'
          )
          wp.write_text(s)

          ca = Path('dpc-app/app/src/main/java/org/mdmopen/dpc/CustomerActivity.kt')
          s = ca.read_text()
          if 'import android.widget.SeekBar\n' not in s:
              s = s.replace('import android.widget.ScrollView\n', 'import android.widget.ScrollView\nimport android.widget.SeekBar\n')

          start = s.index('    private fun wallpaperBrandingToggleCard(): LinearLayout {')
          end = s.index('    private fun personalWelcomeCard(): LinearLayout {', start)
          replacement = r'''    private fun wallpaperBrandingToggleCard(): LinearLayout {
        var homePercent = WallpaperBranding.homeSizePercent(this)
        var lockPercent = WallpaperBranding.lockSizePercent(this)
        val enabledAtStart = WallpaperBranding.isEnabled(this)

        val homeValue = TextView(this).apply {
            text = "$homePercent%"
            textSize = 12.5f
            typeface = heavyFont
            setTextColor(Color.parseColor(ACCENT_DARK))
        }
        val lockValue = TextView(this).apply {
            text = "$lockPercent%"
            textSize = 12.5f
            typeface = heavyFont
            setTextColor(Color.parseColor(ACCENT_DARK))
        }

        fun makeSizeControl(title: String, initial: Int, valueView: TextView, onValue: (Int) -> Unit): LinearLayout {
            val seek = SeekBar(this).apply {
                max = WallpaperBranding.MAX_SIZE_PERCENT - WallpaperBranding.MIN_SIZE_PERCENT
                progress = initial - WallpaperBranding.MIN_SIZE_PERCENT
                isEnabled = enabledAtStart
            }
            seek.setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener {
                override fun onProgressChanged(seekBar: SeekBar?, progress: Int, fromUser: Boolean) {
                    val value = WallpaperBranding.MIN_SIZE_PERCENT + progress
                    valueView.text = "$value%"
                    onValue(value)
                }
                override fun onStartTrackingTouch(seekBar: SeekBar?) = Unit
                override fun onStopTrackingTouch(seekBar: SeekBar?) {
                    if (!WallpaperBranding.isEnabled(this@CustomerActivity)) return
                    val currentHome = homePercent
                    val currentLock = lockPercent
                    Thread {
                        val result = WallpaperBranding.setSizePercents(applicationContext, currentHome, currentLock)
                        runOnUiThread {
                            Toast.makeText(this@CustomerActivity, result, Toast.LENGTH_SHORT).show()
                        }
                    }.start()
                }
            })

            return LinearLayout(this).apply {
                orientation = LinearLayout.VERTICAL
                setPadding(0, dp(8), 0, dp(2))
                addView(LinearLayout(this@CustomerActivity).apply {
                    orientation = LinearLayout.HORIZONTAL
                    gravity = Gravity.CENTER_VERTICAL
                    addView(TextView(this@CustomerActivity).apply {
                        text = title
                        textSize = 13f
                        typeface = mediumFont
                        setTextColor(Color.parseColor(TEXT))
                        gravity = Gravity.RIGHT
                    }, LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f))
                    addView(valueView)
                })
                addView(seek, LinearLayout.LayoutParams(
                    ViewGroup.LayoutParams.MATCH_PARENT,
                    ViewGroup.LayoutParams.WRAP_CONTENT
                ))
                tag = seek
            }
        }

        val homeControl = makeSizeControl("גודל הסמל במסך הבית", homePercent, homeValue) { homePercent = it }
        val lockControl = makeSizeControl("גודל הסמל במסך הנעילה", lockPercent, lockValue) { lockPercent = it }
        val homeSeek = homeControl.tag as SeekBar
        val lockSeek = lockControl.tag as SeekBar

        return LinearLayout(this).apply {
            orientation = LinearLayout.VERTICAL
            gravity = Gravity.RIGHT
            background = cardBackground()
            setPadding(dp(18), dp(14), dp(18), dp(14))

            addView(TextView(this@CustomerActivity).apply {
                text = "סמל על מסך הבית והנעילה"
                textSize = 14.5f
                typeface = heavyFont
                setTextColor(Color.parseColor(TEXT))
                gravity = Gravity.RIGHT
            })

            addView(TextView(this@CustomerActivity).apply {
                text = "אפשר להציג או להסיר את הסמל ולכוון בנפרד את הגודל בכל מסך. טווח גדול במיוחד: ${WallpaperBranding.MIN_SIZE_PERCENT}%–${WallpaperBranding.MAX_SIZE_PERCENT}%."
                textSize = 12f
                typeface = mediumFont
                setTextColor(Color.parseColor(MUTED))
                gravity = Gravity.RIGHT
                setPadding(0, dp(4), 0, dp(9))
            })

            val toggle = Switch(this@CustomerActivity).apply {
                text = if (enabledAtStart) "מוצג" else "מוסר"
                isChecked = enabledAtStart
                setTextColor(Color.parseColor(TEXT))
                typeface = mediumFont
                setOnCheckedChangeListener { button, enabled ->
                    button.isEnabled = false
                    homeSeek.isEnabled = enabled
                    lockSeek.isEnabled = enabled
                    text = if (enabled) "מוסיף סמל..." else "מסיר סמל..."
                    Thread {
                        val result = WallpaperBranding.setEnabled(applicationContext, enabled)
                        runOnUiThread {
                            text = if (enabled) "מוצג" else "מוסר"
                            button.isEnabled = true
                            Toast.makeText(this@CustomerActivity, result, Toast.LENGTH_LONG).show()
                        }
                    }.start()
                }
            }
            addView(toggle, LinearLayout.LayoutParams(
                ViewGroup.LayoutParams.MATCH_PARENT,
                ViewGroup.LayoutParams.WRAP_CONTENT
            ))
            addView(homeControl)
            addView(lockControl)
        }
    }

'''
          s = s[:start] + replacement + s[end:]
          ca.write_text(s)

          test = Path('backend/test-wallpaper-branding-toggle-static.js')
          s = test.read_text()
          extra = '''\nassert(wallpaper.includes('KEY_HOME_SIZE_PERCENT = "customer_branding_home_size_percent"'));\nassert(wallpaper.includes('KEY_LOCK_SIZE_PERCENT = "customer_branding_lock_size_percent"'));\nassert(wallpaper.includes('const val MIN_SIZE_PERCENT = 10'));\nassert(wallpaper.includes('const val MAX_SIZE_PERCENT = 75'));\nassert(wallpaper.includes('fun setSizePercents(context: Context, homePercent: Int, lockPercent: Int): String'));\nassert(customer.includes('SeekBar.OnSeekBarChangeListener'));\nassert(customer.includes('גודל הסמל במסך הבית'));\nassert(customer.includes('גודל הסמל במסך הנעילה'));\n'''
          if 'KEY_HOME_SIZE_PERCENT' not in s:
              s = s.replace("console.log('wallpaper branding customer toggle wiring: ok');", extra + "console.log('wallpaper branding customer toggle wiring: ok');")
          test.write_text(s)
          PY
      - name: Commit patch and remove one-shot workflow
        shell: bash
        run: |
          rm .github/workflows/patch-wallpaper-size-sliders.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dpc-app/app/src/main/java/org/mdmopen/dpc/WallpaperBranding.kt dpc-app/app/src/main/java/org/mdmopen/dpc/CustomerActivity.kt backend/test-wallpaper-branding-toggle-static.js .github/workflows/patch-wallpaper-size-sliders.yml
          git commit -m 'Add independent wallpaper emblem size sliders'
          git push origin HEAD:feat/customer-wallpaper-branding-toggle
