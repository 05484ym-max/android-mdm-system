name: Verify policy hidden-state diff

on:
  push:
    branches:
      - perf/policy-hidden-state-diff

permissions:
  contents: write

jobs:
  patch-build-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-34' 'build-tools;34.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Apply policy diff patch
        run: python tools/patch-policy-hidden-state-diff.py
      - name: Build DPC
        working-directory: dpc-app
        run: gradle assembleDebug --stacktrace
      - name: Verify markers
        run: |
          FILE=dpc-app/app/src/main/java/org/mdmopen/dpc/PolicyEnforcer.kt
          grep -F 'fun applyHiddenStateIfNeeded(pkg: String, shouldHide: Boolean)' "$FILE"
          grep -F 'dpm.isApplicationHidden(admin, pkg) == shouldHide' "$FILE"
      - name: Commit production change only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dpc-app/app/src/main/java/org/mdmopen/dpc/PolicyEnforcer.kt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Apply policy hidden-state changes only when needed'
          git push
