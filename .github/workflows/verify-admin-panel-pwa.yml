name: Verify admin panel PWA

on:
  push:
    branches: [ feature/admin-panel-pwa ]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply PWA wiring
        run: python3 tools/patch-admin-panel-pwa.py
      - name: Verify manifest and shell
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          index = Path('admin-panel/index.html').read_text(encoding='utf-8')
          manifest = json.loads(Path('admin-panel/manifest.webmanifest').read_text(encoding='utf-8'))
          icon = Path('admin-panel/admin-icon.svg').read_text(encoding='utf-8')
          sw = Path('admin-panel/sw.js').read_text(encoding='utf-8')
          pwa = Path('admin-panel/pwa.js').read_text(encoding='utf-8')
          assert 'rel="manifest" href="/manifest.webmanifest"' in index
          assert 'src="/pwa.js"' in index
          assert manifest['display'] == 'standalone'
          assert manifest['theme_color'] == '#173D20'
          assert manifest['icons'][0]['src'] == '/admin-icon.svg'
          assert 'יהודי' in icon and 'כשר' in icon
          assert 'startsWith(\'/api/\')' in sw
          assert "serviceWorker.register('/sw.js')" in pwa
          print('Admin PWA verified')
          PY
      - name: Commit production index wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin-panel/index.html
          git commit -m "Wire admin panel as installable PWA" || exit 0
          git push
