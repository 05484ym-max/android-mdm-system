name: Apply subscription store lock and reminders

on:
  push:
    branches: [feature/subscription-unblock-grace]
    paths:
      - '.github/workflows/patch-subscription-store-lock.yml'

permissions:
  contents: write

jobs:
  finalize-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/subscription-unblock-grace

      - name: Finalize exact weekly reminders and approved-app filtering
        run: |
          python3 - <<'PY'
          from pathlib import Path

          customer = Path('dpc-app/app/src/main/java/org/mdmopen/dpc/CustomerActivity.kt')
          s = customer.read_text()
          old = '        val apps = Config.appCatalog(this)\n            .sortedWith(compareBy<CatalogApp> { it.sortOrder }.thenBy { it.name })'
          new = '        val apps = approvedApps()\n            .sortedWith(compareBy<CatalogApp> { it.sortOrder }.thenBy { it.name })'
          if old not in s:
              raise SystemExit('current store catalog marker not found')
          customer.write_text(s.replace(old, new, 1))

          backend = Path('backend/index.js')
          s = backend.read_text()
          old_bucket = 'const weeklyBucket = daysRemaining >= 22 ? 4 : daysRemaining >= 15 ? 3 : daysRemaining >= 8 ? 2 : 1;'
          new_bucket = 'const weeklyBucket = Math.floor((30 - daysRemaining) / 7);'
          if old_bucket not in s:
              raise SystemExit('weekly bucket marker not found')
          s = s.replace(old_bucket, new_bucket, 1)
          s = s.replace(
              '// Four deterministic pre-expiry reminder ids: 30-22, 21-15, 14-8, 7-1 days.',
              '// Start about a month before expiry, then create a new deterministic reminder every seven days: 30, 23, 16, 9 and 2 days remaining.',
              1,
          )
          s = s.replace(
              '// The id changes only when a new weekly bucket starts, so the device\'s existing\n  // read-id mechanism naturally shows one new unread News badge per week.',
              '// The id is stable inside each seven-day window, so repeated polling does not create duplicate unread News items.',
              1,
          )
          backend.write_text(s)
          PY

      - name: Verify backend JavaScript syntax
        run: node --check backend/index.js

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install SDK packages
        run: sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Compile Android client
        working-directory: dpc-app
        run: gradle assembleDebug --no-daemon

      - name: Verify required behavior markers
        run: |
          grep -F 'val apps = approvedApps()' dpc-app/app/src/main/java/org/mdmopen/dpc/CustomerActivity.kt
          grep -F 'if (!Config.storeAccessAllowed(this))' dpc-app/app/src/main/java/org/mdmopen/dpc/CustomerActivity.kt
          grep -F 'Math.floor((30 - daysRemaining) / 7)' backend/index.js
          grep -F 'חנות האפליקציות והעדכונים תינעל' backend/index.js
          grep -F 'שאר המכשיר והאפליקציות שכבר מותקנות' backend/index.js

      - name: Commit verified finalization
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/index.js dpc-app/app/src/main/java/org/mdmopen/dpc/CustomerActivity.kt
          git commit -m 'Finalize weekly subscription reminders and preserve app allowlist' || exit 0
          git push origin HEAD:feature/subscription-unblock-grace
