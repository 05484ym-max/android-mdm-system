name: Patch News Composer Compact Fonts

on:
  push:
    branches:
      - feat/news-composer-compact-fonts

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/news-composer-compact-fonts
          fetch-depth: 0

      - name: Patch composer layout, fonts, backend and Android rendering
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              s = p.read_text()
              if old not in s:
                  raise SystemExit(f'target not found in {path}: {old[:120]!r}')
              if s.count(old) != 1:
                  raise SystemExit(f'expected one target in {path}, found {s.count(old)}')
              p.write_text(s.replace(old, new, 1))

          # Admin HTML: add stable font choices.
          replace_once(
              'admin-panel/index.html',
              '''        <option value="SYSTEM">רגיל</option>\n        <option value="ROUNDED">מעוגל</option>\n        <option value="SERIF">קלאסי</option>\n        <option value="MONO">מונוספייס</option>''',
              '''        <option value="SYSTEM">רגיל</option>\n        <option value="ROUNDED">מעוגל</option>\n        <option value="SERIF">קלאסי</option>\n        <option value="MONO">מונוספייס</option>\n        <option value="LIGHT">דק</option>\n        <option value="MEDIUM">בינוני</option>\n        <option value="CONDENSED">צר</option>\n        <option value="BLACK">שחור מודגש</option>\n        <option value="SERIF_MONO">קלאסי מונוספייס</option>'''
          )

          # Admin JS: put live preview directly after typography controls, before media.
          replace_once(
              'admin-panel/news.js',
              "  const mediaField = mediaInput && mediaInput.closest('.news-media-field');",
              "  const typographyField = fontFamilyInput && fontFamilyInput.closest('.news-typography-field');"
          )
          replace_once(
              'admin-panel/news.js',
              "  const fontCss = value => ({ SYSTEM: 'inherit', ROUNDED: 'ui-rounded, Arial, sans-serif', SERIF: 'Georgia, Times New Roman, serif', MONO: 'ui-monospace, Consolas, monospace' }[value] || 'inherit');",
              "  const fontCss = value => ({ SYSTEM: 'inherit', ROUNDED: 'ui-rounded, Arial, sans-serif', SERIF: 'Georgia, Times New Roman, serif', MONO: 'ui-monospace, Consolas, monospace', LIGHT: 'Arial, sans-serif', MEDIUM: 'Arial, sans-serif', CONDENSED: 'Arial Narrow, Roboto Condensed, sans-serif', BLACK: 'Arial Black, Arial, sans-serif', SERIF_MONO: 'Courier New, ui-monospace, monospace' }[value] || 'inherit');"
          )
          replace_once(
              'admin-panel/news.js',
              "  if (mediaField) mediaField.insertAdjacentElement('afterend', livePreview);",
              "  if (typographyField) typographyField.insertAdjacentElement('afterend', livePreview);"
          )
          replace_once(
              'admin-panel/news.js',
              "    fontFamilyInput.value = ['SYSTEM','ROUNDED','SERIF','MONO'].includes(String(family || '').toUpperCase()) ? String(family).toUpperCase() : 'SYSTEM';",
              "    fontFamilyInput.value = ['SYSTEM','ROUNDED','SERIF','MONO','LIGHT','MEDIUM','CONDENSED','BLACK','SERIF_MONO'].includes(String(family || '').toUpperCase()) ? String(family).toUpperCase() : 'SYSTEM';"
          )
          # Preview weight differences for the extra choices.
          replace_once(
              'admin-panel/news.js',
              "    liveBubble.style.fontFamily = fontCss(fontFamilyInput.value);",
              "    liveBubble.style.fontFamily = fontCss(fontFamilyInput.value);\n    liveBubble.style.fontWeight = fontFamilyInput.value === 'LIGHT' ? '300' : fontFamilyInput.value === 'MEDIUM' ? '500' : fontFamilyInput.value === 'BLACK' ? '900' : '400';"
          )

          # Compact the composer so controls + preview fit together visually.
          css = Path('admin-panel/news.css')
          cs = css.read_text()
          marker = '/* Compact composer controls and keep live preview directly under typography. */'
          if marker not in cs:
              cs += '''\n\n/* Compact composer controls and keep live preview directly under typography. */\n.news-width-field, .news-typography-field {\n  margin: 6px 0 7px; padding: 9px 10px; border-radius: 12px;\n}\n.news-width-controls { gap: 7px; align-items: center; }\n.news-width-number { width: 70px; padding-top: 7px; padding-bottom: 7px; }\n.news-media-label { margin-bottom: 5px; }\n.news-media-help { margin-top: 4px; line-height: 1.3; }\n#newsFontFamilyInput { padding-top: 8px; padding-bottom: 8px; }\n.news-live-preview { margin: 7px 0 9px; padding: 9px; border-radius: 13px; }\n.news-live-preview-label { margin-bottom: 6px; }\n.news-live-preview-stage { min-height: 92px; padding: 7px; }\n.news-live-bubble { padding: 10px; border-radius: 13px; }\n.news-media-field { margin-top: 8px; }\n@media (max-width: 520px) {\n  .news-width-field, .news-typography-field { padding: 8px; }\n  .news-width-controls input[type=range] { min-width: 0; }\n  .news-width-number { width: 64px; }\n  .news-live-preview-stage { min-height: 82px; }\n}\n'''
              css.write_text(cs)

          # Backend validation: accept the new stable family identifiers.
          replace_once(
              'backend/index.js',
              "const NEWS_FONT_FAMILIES = new Set(['SYSTEM', 'ROUNDED', 'SERIF', 'MONO']);",
              "const NEWS_FONT_FAMILIES = new Set(['SYSTEM', 'ROUNDED', 'SERIF', 'MONO', 'LIGHT', 'MEDIUM', 'CONDENSED', 'BLACK', 'SERIF_MONO']);"
          )

          # Database schema + migration-safe check constraint update.
          db = Path('backend/db.js')
          ds = db.read_text()
          ds = ds.replace(
              "CHECK (font_family IN ('SYSTEM','ROUNDED','SERIF','MONO'))",
              "CHECK (font_family IN ('SYSTEM','ROUNDED','SERIF','MONO','LIGHT','MEDIUM','CONDENSED','BLACK','SERIF_MONO'))"
          )
          anchor = "ALTER TABLE customer_updates ADD COLUMN IF NOT EXISTS font_family TEXT NOT NULL DEFAULT 'SYSTEM' CHECK (font_family IN ('SYSTEM','ROUNDED','SERIF','MONO','LIGHT','MEDIUM','CONDENSED','BLACK','SERIF_MONO'));"
          migration = anchor + "\nALTER TABLE customer_updates DROP CONSTRAINT IF EXISTS customer_updates_font_family_check;\nALTER TABLE customer_updates ADD CONSTRAINT customer_updates_font_family_check CHECK (font_family IN ('SYSTEM','ROUNDED','SERIF','MONO','LIGHT','MEDIUM','CONDENSED','BLACK','SERIF_MONO'));"
          if anchor not in ds:
              raise SystemExit('font_family ALTER anchor not found in backend/db.js')
          ds = ds.replace(anchor, migration, 1)
          db.write_text(ds)

          # Android client: map every stored choice to an Android system font family.
          replace_once(
              'dpc-app/app/src/main/java/org/mdmopen/dpc/CustomerActivity.kt',
              '''        val family = when (item.fontFamily.uppercase()) {\n            "ROUNDED" -> "sans-serif-rounded"\n            "SERIF" -> "serif"\n            "MONO" -> "monospace"\n            else -> "sans-serif"\n        }''',
              '''        val family = when (item.fontFamily.uppercase()) {\n            "ROUNDED" -> "sans-serif-rounded"\n            "SERIF" -> "serif"\n            "MONO" -> "monospace"\n            "LIGHT" -> "sans-serif-light"\n            "MEDIUM" -> "sans-serif-medium"\n            "CONDENSED" -> "sans-serif-condensed"\n            "BLACK" -> "sans-serif-black"\n            "SERIF_MONO" -> "serif-monospace"\n            else -> "sans-serif"\n        }'''
          )
          PY

      - name: Remove one-shot workflow and commit patch
        run: |
          rm .github/workflows/patch-news-composer-compact-fonts.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin-panel/index.html admin-panel/news.js admin-panel/news.css backend/index.js backend/db.js dpc-app/app/src/main/java/org/mdmopen/dpc/CustomerActivity.kt .github/workflows/patch-news-composer-compact-fonts.yml
          git diff --cached --check
          git commit -m "Compact news composer and expand font choices"
          git push origin HEAD:feat/news-composer-compact-fonts
