name: Harden full-open mode

on:
  push:
    branches: [feature/full-open-mode]
    paths:
      - '.github/workflows/fix-full-open-hardening.yml'

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply hardening patch
        run: python3 .github/scripts/fix-full-open-hardening.py

      - name: Verify backend syntax
        run: node --check backend/index.js && node --check backend/db.js && node --check admin-panel/full-open.js

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Compile DPC
        working-directory: dpc-app
        run: gradle compileDebugKotlin

      - name: Verify hardening markers
        run: |
          grep -q "requireAdmin, fullOpenAdminLimiter" backend/index.js
          grep -q 'KEY_POLICY_HIDDEN_APPS' dpc-app/app/src/main/java/org/mdmopen/dpc/Config.kt
          grep -q 'MATCH_UNINSTALLED_PACKAGES' dpc-app/app/src/main/java/org/mdmopen/dpc/PolicyEnforcer.kt
          grep -q 'Config.setPolicyHiddenApps' dpc-app/app/src/main/java/org/mdmopen/dpc/PolicyEnforcer.kt

      - name: Commit verified hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/index.js dpc-app/app/src/main/java/org/mdmopen/dpc/Config.kt dpc-app/app/src/main/java/org/mdmopen/dpc/PolicyEnforcer.kt
          git commit -m "Harden reversible full-open recovery"
          git push origin HEAD:feature/full-open-mode
