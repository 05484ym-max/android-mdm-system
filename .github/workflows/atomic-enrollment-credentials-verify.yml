name: Verify atomic enrollment credentials

on:
  push:
    branches:
      - fix/atomic-enrollment-credentials

permissions:
  contents: write

jobs:
  patch-build-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-34' 'build-tools;34.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Apply atomic enrollment patch
        run: python tools/patch-atomic-enrollment-credentials.py
      - name: Build DPC
        working-directory: dpc-app
        run: gradle assembleDebug --stacktrace
      - name: Verify markers
        run: |
          grep -F 'fun setEnrollmentCredentials(context: Context, deviceId: String, deviceToken: String)' dpc-app/app/src/main/java/org/mdmopen/dpc/Config.kt
          grep -F '.commit()' dpc-app/app/src/main/java/org/mdmopen/dpc/Config.kt
          grep -F 'Config.setEnrollmentCredentials(' dpc-app/app/src/main/java/org/mdmopen/dpc/MainActivity.kt
          grep -F 'Config.setEnrollmentCredentials(' dpc-app/app/src/main/java/org/mdmopen/dpc/ProvisioningActivity.kt
      - name: Commit production changes only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            dpc-app/app/src/main/java/org/mdmopen/dpc/Config.kt \
            dpc-app/app/src/main/java/org/mdmopen/dpc/MainActivity.kt \
            dpc-app/app/src/main/java/org/mdmopen/dpc/ProvisioningActivity.kt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Persist enrollment credentials atomically'
          git push
