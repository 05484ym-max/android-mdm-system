name: Verify enrollment and login hardening

on:
  push:
    branches: [ fix/enrollment-login-rate-hardening ]

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python tools/patch-enrollment-login-hardening.py
      - name: Verify backend syntax
        run: node --check backend/index.js
      - name: Verify security markers
        run: |
          grep -q "randomBytes(16)" backend/index.js
          grep -q "const loginLimiter = rateLimit" backend/index.js
          grep -q "deviceRegistrationLimiter" backend/index.js
          ! grep -q "const loginAttempts = new Map" backend/index.js
      - name: Commit production change only
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add backend/index.js
          git commit -m 'Harden enrollment and login rate limiting'
          git push
