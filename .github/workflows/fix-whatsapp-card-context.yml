name: Fix WhatsApp Card Context
on:
  push:
    branches: [fix/whatsapp-card-context]
    paths: [.github/workflows/fix-whatsapp-card-context.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/whatsapp-card-context
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Apply guarded fix
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('dpc-app/app/src/main/java/org/mdmopen/dpc/WhatsAppGuardEngine.kt')
          s=p.read_text()
          old='''        if (source != null) {\n            addDescendants(source, 2)\n            var parent = source.parent\n            repeat(2) {\n                add(parent)\n                parent = parent?.parent\n            }\n        }\n'''
          new='''        if (source != null) {\n            addDescendants(source, 2)\n\n            // Newer WhatsApp builds often expose identifying text as a sibling\n            // of the exact node that receives the click. Inspect only the\n            // immediate card subtree so individual status/channel blocking can\n            // see that local context without scanning unrelated rows.\n            val card = source.parent\n            addDescendants(card, 2)\n            add(card?.parent)\n        }\n'''
          if s.count(old)!=1: raise SystemExit('engine anchor mismatch')
          s=s.replace(old,new)
          old4='''                !WhatsAppGuardTerms.isUpdates(text, id) && WhatsAppGuardTerms.isStatus(text, id)\n'''
          new4='''                !WhatsAppGuardTerms.isUpdates(text, id) &&\n                    (WhatsAppGuardTerms.isStatus(text, id) || WhatsAppGuardTerms.isStatusContext(text))\n'''
          if s.count(old4)!=1: raise SystemExit('engine status anchor mismatch')
          p.write_text(s.replace(old4,new4))

          t=Path('dpc-app/app/src/main/java/org/mdmopen/dpc/WhatsAppGuardTerms.kt')
          q=t.read_text()
          old2='''    private val channelContextWords = setOf(\n        "עקוב", "עוקב", "עוקבים", "עקיבה",\n        "follow", "following", "followers",\n    )\n'''
          new2='''    private val channelContextWords = setOf(\n        "עקוב", "עוקב", "עוקבים", "עקיבה", "במעקב",\n        "follow", "following", "followers",\n    )\n\n    private val statusContextPrefixes = setOf(\n        "עדכון סטטוס", "הסטטוס שלי", "סטטוס חדש",\n        "status update", "my status", "new status",\n    )\n'''
          if q.count(old2)!=1: raise SystemExit('terms anchor 1 mismatch')
          q=q.replace(old2,new2)
          old3='''    fun isChannelContext(text: String?): Boolean {\n        val normalized = normalizeText(text)\n        if (normalized.isEmpty()) return false\n        return channelContextWords.any { word ->\n            normalized == word ||\n                normalized.startsWith("$word ") ||\n                normalized.endsWith(" $word") ||\n                normalized.contains(" $word ")\n        }\n    }\n'''
          new3='''    fun isChannelContext(text: String?): Boolean {\n        val normalized = normalizeText(text)\n        if (normalized.isEmpty()) return false\n        return channelContextWords.any { word ->\n            normalized == word ||\n                normalized.startsWith("$word ") ||\n                normalized.endsWith(" $word") ||\n                normalized.contains(" $word ")\n        }\n    }\n\n    fun isStatusContext(text: String?): Boolean {\n        val normalized = normalizeText(text)\n        if (normalized.isEmpty()) return false\n        return statusContextPrefixes.any { prefix ->\n            normalized == prefix || normalized.startsWith("$prefix ") || normalized.startsWith("$prefix,")\n        }\n    }\n'''
          if q.count(old3)!=1: raise SystemExit('terms anchor 2 mismatch')
          t.write_text(q.replace(old3,new3))
          PY
      - name: Add regression tests
        run: |
          mkdir -p dpc-app/app/src/test/java/org/mdmopen/dpc
          cat > dpc-app/app/src/test/java/org/mdmopen/dpc/WhatsAppGuardTermsRegressionTest.kt <<'EOF'
          package org.mdmopen.dpc

          import org.junit.Assert.assertFalse
          import org.junit.Assert.assertTrue
          import org.junit.Test

          class WhatsAppGuardTermsRegressionTest {
              @Test fun channelContextRecognizesNewWhatsAppHebrewFollowing() {
                  assertTrue(WhatsAppGuardTerms.isChannelContext("במעקב"))
                  assertTrue(WhatsAppGuardTerms.isChannelContext("123 עוקבים"))
              }

              @Test fun statusContextRecognizesStatusCardDescriptions() {
                  assertTrue(WhatsAppGuardTerms.isStatusContext("עדכון סטטוס מאת יוסי"))
                  assertTrue(WhatsAppGuardTerms.isStatusContext("Status update from Joe"))
                  assertTrue(WhatsAppGuardTerms.isStatusContext("הסטטוס שלי"))
              }

              @Test fun ordinaryChatTextDoesNotBecomeContext() {
                  assertFalse(WhatsAppGuardTerms.isStatusContext("דיברנו על סטטוס אתמול"))
                  assertFalse(WhatsAppGuardTerms.isChannelContext("ערוץ הספורט"))
              }
          }
          EOF
      - name: Test Android
        working-directory: dpc-app
        run: gradle testDebugUnitTest assembleDebug --no-daemon
      - name: Commit product changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/fix-whatsapp-card-context.yml
          git add dpc-app/app/src/main/java/org/mdmopen/dpc/WhatsAppGuardEngine.kt dpc-app/app/src/main/java/org/mdmopen/dpc/WhatsAppGuardTerms.kt dpc-app/app/src/test/java/org/mdmopen/dpc/WhatsAppGuardTermsRegressionTest.kt
          git diff --cached --check
          git commit -m 'Fix individual WhatsApp status and channel blocking'
          git push origin HEAD:fix/whatsapp-card-context
