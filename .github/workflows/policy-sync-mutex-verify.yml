name: Verify PolicySync mutex

on:
  push:
    branches:
      - fix/policy-sync-mutex

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-34' 'build-tools;34.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build DPC
        working-directory: dpc-app
        run: gradle assembleDebug --stacktrace
      - name: Verify mutex marker
        run: grep -F 'fun run(context: Context): String = synchronized(syncLock)' dpc-app/app/src/main/java/org/mdmopen/dpc/PolicySync.kt
