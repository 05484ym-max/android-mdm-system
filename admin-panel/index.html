<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MDM Admin Panel</title>
<style>
  :root {
    --bg: #0b0b0c;
    --card-bg: #1a1a1c;
    --card-border: rgba(212, 175, 55, 0.25);
    --gold: #d4af37;
    --gold-soft: #e8cf7a;
    --text: #f2ede1;
    --text-dim: #a9a49a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: Georgia, 'Times New Roman', serif;
    padding: 20px; direction: rtl;
  }
  header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
  h1 { font-size: 1.5rem; color: var(--gold-soft); margin: 0; letter-spacing: 0.5px; }
  .refresh-btn {
    background: none; border: 1px solid var(--card-border); color: var(--gold);
    border-radius: 50%; width: 40px; height: 40px; font-size: 1.1rem; cursor: pointer;
  }
  .login-screen {
    position: fixed; inset: 0; background: var(--bg); z-index: 20;
    display: none; align-items: center; justify-content: center;
  }
  .login-card {
    background: var(--card-bg); border: 1px solid var(--card-border);
    border-radius: 16px; padding: 32px; width: 100%; max-width: 320px; text-align: center;
  }
  .login-card h2 { color: var(--gold-soft); font-size: 1.2rem; margin: 0 0 20px; }
  .login-input {
    width: 100%; padding: 10px 12px; margin-bottom: 12px; border-radius: 8px;
    border: 1px solid var(--card-border); background: #111; color: var(--text); font-family: inherit;
  }
  .login-error { color: #e05c5c; font-size: 0.8rem; min-height: 1em; margin-top: 10px; }
  .enroll-card {
    background: var(--card-bg); border: 1px solid var(--card-border);
    border-radius: 16px; padding: 18px; margin-bottom: 24px;
  }
  .enroll-card h2 { color: var(--gold-soft); font-size: 1.05rem; margin: 0 0 12px; }
  .code-box {
    font-family: monospace; font-size: 1.4rem; letter-spacing: 3px; color: var(--gold);
    background: #111113; border: 1px dashed var(--card-border); border-radius: 10px;
    padding: 14px; text-align: center; margin-top: 12px; direction: ltr;
  }
  .stats {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
    gap: 14px; margin-bottom: 24px;
  }
  .stat-card {
    background: var(--card-bg); border: 1px solid var(--card-border);
    border-radius: 16px; padding: 18px; text-align: center;
  }
  .stat-card .label { color: var(--text-dim); font-size: 0.85rem; margin-bottom: 8px; }
  .stat-card .value { color: var(--gold); font-size: 1.8rem; font-weight: bold; }
  .devices-section {
    background: var(--card-bg); border: 1px solid var(--card-border);
    border-radius: 16px; padding: 18px;
  }
  .devices-section h2 { color: var(--gold-soft); font-size: 1.1rem; margin-top: 0; }
  .device-row {
    display: flex; justify-content: space-between; align-items: center;
    flex-wrap: wrap; gap: 10px; padding: 14px 0; border-bottom: 1px solid var(--card-border);
  }
  .device-row:last-child { border-bottom: none; }
  .device-info { display: flex; flex-direction: column; gap: 4px; }
  .device-id { color: var(--text); font-size: 1rem; font-weight: bold; word-break: break-all; }
  .device-date { color: var(--text-dim); font-size: 0.78rem; }
  .status-active { color: #7ed957; font-size: 0.85rem; }
  .status-expired { color: #e05c5c; font-size: 0.85rem; }
  .status-none { color: var(--text-dim); font-size: 0.85rem; }
  .device-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .price-input {
    width: 90px; padding: 7px 8px; border-radius: 8px; border: 1px solid var(--card-border);
    background: #111; color: var(--text); font-family: inherit;
  }
  .renew-btn {
    background: var(--gold); color: #0b0b0c; border: none; border-radius: 8px;
    padding: 8px 12px; font-weight: bold; cursor: pointer; font-family: inherit;
  }
  .toggle-btn {
    background: transparent; border: 1px solid var(--gold); color: var(--gold);
    border-radius: 8px; padding: 8px 12px; cursor: pointer; font-family: inherit; font-size: 0.85rem;
  }
  .side-panel {
    width: 100%; margin-top: 10px; padding: 12px;
    background: #111113; border: 1px solid var(--card-border); border-radius: 12px;
  }
  .app-list { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
  .app-chip {
    display: inline-flex; align-items: center; gap: 6px; background: #1f1f22;
    border: 1px solid var(--card-border); color: var(--gold-soft);
    border-radius: 20px; padding: 5px 10px; font-size: 0.8rem;
  }
  .remove-app-btn { background: none; border: none; color: #e05c5c; cursor: pointer; font-size: 0.85rem; padding: 0; }
  .add-app-row { display: flex; gap: 8px; margin-bottom: 8px; }
  .package-input {
    flex: 1; min-width: 0; padding: 7px 8px; border-radius: 8px; border: 1px solid var(--card-border);
    background: #111; color: var(--text); font-family: inherit; direction: ltr; text-align: right;
  }
  .add-app-btn {
    background: var(--gold); color: #0b0b0c; border: none; border-radius: 8px;
    padding: 7px 14px; font-weight: bold; cursor: pointer; font-family: inherit; white-space: nowrap;
  }
  .no-apps { color: var(--text-dim); font-size: 0.8rem; }
  .cmd-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
  .cmd-btn {
    background: transparent; border: 1px solid var(--card-border); color: var(--text);
    border-radius: 8px; padding: 7px 12px; cursor: pointer; font-family: inherit; font-size: 0.8rem;
  }
  .cmd-danger { border-color: rgba(224,92,92,0.4); color: #e05c5c; }
  .cmd-log-title { color: var(--text-dim); font-size: 0.75rem; margin: 8px 0 4px; }
  .cmd-log-item { color: var(--text); font-size: 0.8rem; padding: 3px 0; }
  .cmd-pending { color: var(--gold-soft); }
  .empty-state { text-align: center; color: var(--text-dim); padding: 30px 0; }
  .search-input {
    width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--card-border);
    background: #111113; color: var(--text); font-family: inherit; margin-bottom: 14px;
  }
  .customer-row { display: flex; gap: 8px; margin-bottom: 4px; }
  .customer-input {
    padding: 6px 8px; border-radius: 8px; border: 1px solid var(--card-border);
    background: #111; color: var(--text); font-family: inherit; font-size: 0.85rem;
  }
  .customer-name { color: var(--gold-soft); font-size: 1.05rem; font-weight: bold; }
  .catalog-row {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    padding: 10px 0; border-bottom: 1px solid var(--card-border);
  }
  .catalog-row:last-child { border-bottom: none; }
  .catalog-name { color: var(--text); font-weight: bold; min-width: 140px; }
  .catalog-package { color: var(--text-dim); font-size: 0.78rem; direction: ltr; }
  .catalog-icon {
    width: 40px; height: 40px; border-radius: 10px; object-fit: cover;
    background: #111113; border: 1px solid var(--card-border); flex-shrink: 0;
  }
  .catalog-icon-placeholder {
    width: 40px; height: 40px; border-radius: 10px; flex-shrink: 0;
    background: #111113; border: 1px solid var(--card-border);
    display: flex; align-items: center; justify-content: center;
    color: var(--text-dim); font-size: 1rem; font-weight: bold;
  }
  .catalog-select {
    padding: 7px 8px; border-radius: 8px; border: 1px solid var(--card-border);
    background: #111; color: var(--text); font-family: inherit; font-size: 0.8rem;
  }
  .open-detail-btn {
    background: var(--gold); color: #0b0b0c; border: none; border-radius: 8px;
    padding: 9px 16px; font-weight: bold; cursor: pointer; font-family: inherit;
  }
  .detail-view {
    position: fixed; inset: 0; background: var(--bg); z-index: 30;
    overflow-y: auto; padding: 20px; display: none;
  }
  .detail-header { display: flex; align-items: center; gap: 16px; margin-bottom: 20px; }
  .back-btn {
    background: transparent; border: 1px solid var(--card-border); color: var(--gold);
    border-radius: 8px; padding: 9px 16px; cursor: pointer; font-family: inherit; flex-shrink: 0;
  }
  .detail-title { color: var(--gold-soft); font-size: 1.3rem; font-weight: bold; }
  .detail-body { max-width: 680px; margin: 0 auto; }
  .detail-section {
    background: var(--card-bg); border: 1px solid var(--card-border);
    border-radius: 16px; padding: 18px; margin-bottom: 16px;
  }
  .detail-section h3 { color: var(--gold-soft); font-size: 1rem; margin: 0 0 12px; }
  .detail-id-box {
    font-family: monospace; font-size: 1.6rem; letter-spacing: 2px; color: var(--gold);
    background: #111113; border: 1px dashed var(--card-border); border-radius: 10px;
    padding: 12px; text-align: center; direction: ltr; margin-bottom: 10px;
  }
  .field-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 8px; }
  .field-row:last-child { margin-bottom: 0; }
</style>
</head>
<body>

<div id="loginScreen" class="login-screen">
  <div class="login-card">
    <h2>התחברות מנהל</h2>
    <input id="loginUsername" class="login-input" placeholder="שם משתמש" autocomplete="username" />
    <input id="loginPassword" type="password" class="login-input" placeholder="סיסמה" autocomplete="current-password" />
    <button class="renew-btn" id="loginBtn" style="width:100%;">התחבר</button>
    <div id="loginError" class="login-error"></div>
  </div>
</div>

<header>
  <h1>לוח בקרה — MDM</h1>
  <button class="refresh-btn" onclick="loadDevices()">⟳</button>
</header>

<div class="enroll-card">
  <h2>רישום מכשיר חדש</h2>
  <button class="renew-btn" id="genCodeBtn">צור קוד רישום</button>
  <div id="codeBox" class="code-box" style="display:none;"></div>
</div>

<div class="enroll-card">
  <h2>חנות אפליקציות</h2>
  <input class="search-input" id="catalogSearch" placeholder="חיפוש בקטלוג לפי שם..." />
  <div id="catalogList"><div class="empty-state">טוען...</div></div>
  <div class="add-app-row" style="margin-top:10px;">
    <input class="package-input" id="newAppName" placeholder="שם האפליקציה (לדוגמה: וויז)" />
    <input class="package-input" id="newAppPackage" placeholder="com.waze" />
    <button class="add-app-btn" id="addAppToCatalogBtn">הוסף לקטלוג</button>
  </div>
</div>

<div class="stats">
  <div class="stat-card">
    <div class="label">סה"כ מכשירים</div>
    <div class="value" id="totalDevices">0</div>
  </div>
  <div class="stat-card">
    <div class="label">מנויים פעילים</div>
    <div class="value" id="activeSubs">0</div>
  </div>
  <div class="stat-card">
    <div class="label">עדכון אחרון</div>
    <div class="value" id="lastUpdate" style="font-size:0.9rem;">—</div>
  </div>
</div>

<div class="devices-section">
  <h2>מכשירים, מנויים ופקודות</h2>
  <input class="search-input" id="deviceSearch" placeholder="חיפוש לפי מספר לקוח, שם או מזהה מכשיר..." />
  <div id="devicesList"><div class="empty-state">טוען...</div></div>
</div>

<div id="deviceDetailView" class="detail-view">
  <div class="detail-header">
    <button class="back-btn" id="detailBackBtn">→ חזרה לרשימה</button>
    <div id="detailTitle" class="detail-title"></div>
  </div>
  <div id="detailContent" class="detail-body"></div>
</div>

<script>
let currentDetailDeviceId = null;

function escapeHtml(str) {
  return String(str).replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
  }[c]));
}

function commandLabel(cmd) {
  return {
    LOCK: 'נעילה', SYNC_POLICY: 'סנכרון מדיניות', REBOOT: 'הפעלה מחדש',
    WIPE: 'מחיקת מכשיר', INSTALL_APP: 'התקנת אפליקציה', UNINSTALL_APP: 'הסרת אפליקציה',
    OPEN_PLAY_STORE_INSTALL: 'התקנה דרך Play Store',
  }[cmd] || cmd;
}

function subStatus(d) {
  if (d.subscriptionStatus === 'active') {
    const until = new Date(d.subscription.expiryDate).toLocaleDateString('he-IL');
    return { text: `מנוי פעיל עד ${until} · ${d.subscription.price} ₪`, cls: 'status-active' };
  }
  if (d.subscriptionStatus === 'expired') {
    const until = new Date(d.subscription.expiryDate).toLocaleDateString('he-IL');
    return { text: `המנוי פג תוקף ב-${until}`, cls: 'status-expired' };
  }
  return { text: 'אין מנוי פעיל', cls: 'status-none' };
}

async function queueCommand(deviceId, command, params) {
  const res = await fetch(`/api/devices/${encodeURIComponent(deviceId)}/commands`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ command, params }),
  });
  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    alert(err.error || 'הפקודה נדחתה');
    return false;
  }
  return true;
}

let allDevices = [];
let allApps = [];

async function loadDevices() {
  const res = await fetch('/api/devices');

  if (res.status === 401) {
    document.getElementById('loginScreen').style.display = 'flex';
    return;
  }
  document.getElementById('loginScreen').style.display = 'none';

  allDevices = await res.json();
  document.getElementById('totalDevices').textContent = allDevices.length;
  document.getElementById('activeSubs').textContent =
    allDevices.filter(d => d.subscriptionStatus === 'active').length;
  document.getElementById('lastUpdate').textContent = new Date().toLocaleTimeString('he-IL');

  renderDeviceList(filterDevices(document.getElementById('deviceSearch').value));
  loadAppsCatalog();

  if (currentDetailDeviceId) {
    if (allDevices.some(d => d.deviceId === currentDetailDeviceId)) {
      renderDeviceDetail(currentDetailDeviceId);
    } else {
      closeDeviceDetail();
    }
  }
}

function filterDevices(query) {
  const q = (query || '').trim().toLowerCase();
  if (!q) return allDevices;
  return allDevices.filter(d =>
    (d.customerName || '').toLowerCase().includes(q) ||
    (d.customerNumber || '').toLowerCase().includes(q) ||
    d.deviceId.toLowerCase().includes(q)
  );
}

function renderDeviceList(devices) {
  const listEl = document.getElementById('devicesList');

  if (allDevices.length === 0) {
    listEl.innerHTML = '<div class="empty-state">עוד לא נרשמו מכשירים</div>';
    return;
  }
  if (devices.length === 0) {
    listEl.innerHTML = '<div class="empty-state">לא נמצאו מכשירים תואמים</div>';
    return;
  }

  listEl.innerHTML = devices.map(d => {
    const status = subStatus(d);
    const id = escapeHtml(d.deviceId);

    return `
      <div class="device-row">
        <div class="device-info">
          <div class="customer-name">${d.customerName ? escapeHtml(d.customerName) : 'ללא שם'}${d.customerNumber ? ' · #' + escapeHtml(d.customerNumber) : ''}</div>
          <div class="device-id">מזהה מכשיר: ${id}</div>
          <div class="${status.cls}">${escapeHtml(status.text)}</div>
        </div>
        <div class="device-actions">
          <button class="open-detail-btn" data-open-detail="${id}">פרטי לקוח</button>
        </div>
      </div>
    `;
  }).join('');

  document.querySelectorAll('[data-open-detail]').forEach(btn => {
    btn.addEventListener('click', () => openDeviceDetail(btn.getAttribute('data-open-detail')));
  });
}

function openDeviceDetail(deviceId) {
  currentDetailDeviceId = deviceId;
  renderDeviceDetail(deviceId);
  document.getElementById('deviceDetailView').style.display = 'block';
  window.scrollTo(0, 0);
}

function closeDeviceDetail() {
  currentDetailDeviceId = null;
  document.getElementById('deviceDetailView').style.display = 'none';
}

document.getElementById('detailBackBtn').addEventListener('click', closeDeviceDetail);

/** Everything about one device, laid out as full sections instead of the
 * cramped inline toggles the list used to have. */
function renderDeviceDetail(deviceId) {
  const d = allDevices.find(x => x.deviceId === deviceId);
  if (!d) { closeDeviceDetail(); return; }

  const status = subStatus(d);
  const apps = (d.policy && d.policy.allowedApps) || [];
  const pending = d.pendingCommands || [];
  const history = d.commandHistory || [];
  const id = escapeHtml(d.deviceId);

  document.getElementById('detailTitle').textContent = d.customerName || 'לקוח ללא שם';

  const appsHtml = apps.length
    ? apps.map(a => `<span class="app-chip">${escapeHtml(a)} <button class="remove-app-btn" data-package="${escapeHtml(a)}">✕</button></span>`).join('')
    : '<span class="no-apps">אין אפליקציות ברשימה — כרגע הכל מותר כברירת מחדל</span>';

  const statusLine = d.status
    ? `${escapeHtml(d.status.model || '')} · Android ${escapeHtml(d.status.androidVersion || '?')} · נראה לאחרונה: ${escapeHtml(new Date(d.status.lastSeen).toLocaleString('he-IL'))}`
    : 'טרם דיווח מצב';

  const cmdLog =
    (pending.length ? '<div class="cmd-log-title">ממתינות לשליחה:</div>' + pending.map(c => `<div class="cmd-log-item cmd-pending">${escapeHtml(commandLabel(c.command))} · ${escapeHtml(new Date(c.queuedAt).toLocaleString('he-IL'))}</div>`).join('') : '') +
    (history.length ? '<div class="cmd-log-title">היסטוריה:</div>' + history.slice(-5).reverse().map(c => `<div class="cmd-log-item">${escapeHtml(commandLabel(c.command))} · נשלח ${escapeHtml(new Date(c.deliveredAt).toLocaleString('he-IL'))}</div>`).join('') : '') +
    (!pending.length && !history.length ? '<div class="no-apps">אין פקודות עדיין</div>' : '');

  document.getElementById('detailContent').innerHTML = `
    <div class="detail-section">
      <h3>מזהה מכשיר</h3>
      <div class="detail-id-box">${id}</div>
      <div class="device-date">נרשם: ${escapeHtml(new Date(d.registeredAt).toLocaleString('he-IL'))}</div>
      <div class="device-date">${statusLine}</div>
    </div>

    <div class="detail-section">
      <h3>פרטי לקוח</h3>
      <div class="field-row">
        <input class="customer-input" id="detailCustomerName" placeholder="שם לקוח" value="${escapeHtml(d.customerName || '')}" />
        <input class="customer-input" id="detailCustomerNumber" placeholder="מס' טלפון" value="${escapeHtml(d.customerNumber || '')}" />
        <button class="add-app-btn" id="detailSaveCustomer">שמור</button>
      </div>
    </div>

    <div class="detail-section">
      <h3>מנוי</h3>
      <div class="${status.cls}" style="margin-bottom:10px;">${escapeHtml(status.text)}</div>
      <div class="field-row">
        <input type="number" class="price-input" id="detailPrice" placeholder="מחיר ₪" min="0" />
        <button class="renew-btn" id="detailRenew">הפעל/חדש מנוי</button>
      </div>
    </div>

    <div class="detail-section">
      <h3>אפליקציות מותרות (${apps.length})</h3>
      <div class="app-list">${appsHtml}</div>
      <div class="add-app-row">
        <input class="package-input" id="detailAddPackage" placeholder="com.whatsapp" />
        <button class="add-app-btn" id="detailAddApp">הוסף</button>
      </div>
    </div>

    <div class="detail-section">
      <h3>סנכרון וקיוסק</h3>
      <div class="field-row">
        <input type="number" class="package-input" id="detailInterval" min="15" max="1440" value="${(d.policy && d.policy.syncIntervalMinutes) || 60}" style="max-width:110px;" />
        <button class="add-app-btn" id="detailSetInterval">דקות בין סנכרונים</button>
      </div>
      <div class="field-row">
        <button class="toggle-btn" id="detailKiosk">${(d.policy && d.policy.kioskEnabled) ? 'קיוסק: פעיל (לחץ לכיבוי)' : 'קיוסק: כבוי (לחץ להפעלה)'}</button>
      </div>
    </div>

    <div class="detail-section">
      <h3>פעולות ופקודות</h3>
      <div class="cmd-actions">
        <button class="cmd-btn" data-cmd="LOCK">נעילה</button>
        <button class="cmd-btn" data-cmd="SYNC_POLICY">סנכרון מדיניות</button>
        <button class="cmd-btn" data-cmd="REBOOT">הפעלה מחדש</button>
        <button class="cmd-btn cmd-danger" data-cmd="WIPE">מחיקת מכשיר</button>
      </div>
      <div class="add-app-row">
        <input class="package-input" id="detailApkUrl" placeholder="https://example.com/app.apk" />
        <button class="add-app-btn" id="detailInstallApk">התקן</button>
      </div>
      <div class="add-app-row">
        <input class="package-input" id="detailUninstallPackage" placeholder="com.example.app" />
        <button class="add-app-btn" id="detailUninstall">הסר</button>
      </div>
      <div class="cmd-log">${cmdLog}</div>
    </div>
  `;

  bindDetailHandlers(d);
}

function bindDetailHandlers(d) {
  const deviceId = d.deviceId;

  document.getElementById('detailSaveCustomer').addEventListener('click', async () => {
    const name = document.getElementById('detailCustomerName').value.trim();
    const number = document.getElementById('detailCustomerNumber').value.trim();
    await fetch(`/api/devices/${encodeURIComponent(deviceId)}/customer`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name, number }),
    });
    loadDevices();
  });

  document.getElementById('detailRenew').addEventListener('click', async () => {
    const input = document.getElementById('detailPrice');
    const price = Number(input.value);
    if (!input.value || isNaN(price) || price < 0) { alert('נא להזין מחיר תקין'); return; }
    await fetch(`/api/devices/${encodeURIComponent(deviceId)}/subscription`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ price }),
    });
    loadDevices();
  });

  document.getElementById('detailAddApp').addEventListener('click', async () => {
    const input = document.getElementById('detailAddPackage');
    const packageName = input.value.trim();
    if (!packageName) return;
    const res = await fetch(`/api/devices/${encodeURIComponent(deviceId)}/policy/apps`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ packageName }),
    });
    if (!res.ok) { alert('שם חבילה לא תקין. דוגמה: com.whatsapp'); return; }
    loadDevices();
  });

  document.querySelectorAll('#detailContent .remove-app-btn').forEach(btn => {
    btn.addEventListener('click', async () => {
      const packageName = btn.getAttribute('data-package');
      await fetch(`/api/devices/${encodeURIComponent(deviceId)}/policy/apps/${encodeURIComponent(packageName)}`, { method: 'DELETE' });
      loadDevices();
    });
  });

  document.getElementById('detailSetInterval').addEventListener('click', async () => {
    const input = document.getElementById('detailInterval');
    const res = await fetch(`/api/devices/${encodeURIComponent(deviceId)}/policy/sync-interval`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ minutes: Number(input.value) }),
    });
    if (!res.ok) { alert('התדירות חייבת להיות בין 15 ל-1440 דקות'); return; }
    loadDevices();
  });

  document.getElementById('detailKiosk').addEventListener('click', async () => {
    const enabled = !(d.policy && d.policy.kioskEnabled);
    await fetch(`/api/devices/${encodeURIComponent(deviceId)}/policy/kiosk`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ enabled }),
    });
    loadDevices();
  });

  document.querySelectorAll('#detailContent .cmd-btn').forEach(btn => {
    btn.addEventListener('click', async () => {
      const command = btn.getAttribute('data-cmd');
      if (command === 'WIPE' && !confirm('פעולה זו תמחק את המכשיר במלואו. להמשיך?')) return;
      if (await queueCommand(deviceId, command, {})) loadDevices();
    });
  });

  document.getElementById('detailInstallApk').addEventListener('click', async () => {
    const input = document.getElementById('detailApkUrl');
    const apkUrl = input.value.trim();
    if (!apkUrl) return;
    if (await queueCommand(deviceId, 'INSTALL_APP', { apkUrl })) loadDevices();
  });

  document.getElementById('detailUninstall').addEventListener('click', async () => {
    const input = document.getElementById('detailUninstallPackage');
    const packageName = input.value.trim();
    if (!packageName) return;
    if (await queueCommand(deviceId, 'UNINSTALL_APP', { packageName })) loadDevices();
  });
}

document.getElementById('loginBtn').addEventListener('click', async () => {
  const errEl = document.getElementById('loginError');
  errEl.textContent = '';
  const res = await fetch('/api/login', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      username: document.getElementById('loginUsername').value,
      password: document.getElementById('loginPassword').value,
    }),
  });
  if (!res.ok) { errEl.textContent = 'שם משתמש או סיסמה שגויים'; return; }
  document.getElementById('loginPassword').value = '';
  loadDevices();
});

document.getElementById('genCodeBtn').addEventListener('click', async () => {
  const box = document.getElementById('codeBox');
  const res = await fetch('/api/enrollments', { method: 'POST' });
  box.style.display = 'block';
  if (!res.ok) { box.textContent = 'שגיאה'; return; }
  const data = await res.json();
  box.textContent = data.token;
});

async function loadAppsCatalog() {
  const res = await fetch('/api/apps');
  if (!res.ok) return;
  allApps = await res.json();
  renderCatalog(filterCatalog(document.getElementById('catalogSearch').value));
}

function filterCatalog(query) {
  const q = (query || '').trim().toLowerCase();
  if (!q) return allApps;
  return allApps.filter(a =>
    a.name.toLowerCase().includes(q) || a.packageName.toLowerCase().includes(q)
  );
}

function renderCatalog(apps) {
  const listEl = document.getElementById('catalogList');

  if (allApps.length === 0) {
    listEl.innerHTML = '<div class="empty-state">הקטלוג ריק — הוסיפו אפליקציה למטה</div>';
    return;
  }
  if (apps.length === 0) {
    listEl.innerHTML = '<div class="empty-state">לא נמצאו אפליקציות תואמות</div>';
    return;
  }

  const deviceOptions = allDevices.map(d =>
    `<option value="${escapeHtml(d.deviceId)}">${escapeHtml(d.customerName || d.deviceId)}</option>`
  ).join('');

  listEl.innerHTML = apps.map(a => `
    <div class="catalog-row">
      ${a.iconUrl
        ? `<img class="catalog-icon" src="${escapeHtml(a.iconUrl)}" alt="" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'catalog-icon-placeholder',textContent:'${escapeHtml((a.name || '?')[0])}'}))" />`
        : `<div class="catalog-icon-placeholder">${escapeHtml((a.name || '?')[0])}</div>`
      }
      <div>
        <div class="catalog-name">${escapeHtml(a.name)}</div>
        <div class="catalog-package">${escapeHtml(a.packageName)}</div>
      </div>
      <button class="add-app-btn" data-refresh-icon="${escapeHtml(a.packageName)}" data-refresh-name="${escapeHtml(a.name)}" title="רענן אייקון">↻</button>
      <button class="add-app-btn" data-assign-all="${escapeHtml(a.packageName)}">הוסף לכולם</button>
      <select class="catalog-select" data-device-select-for="${escapeHtml(a.packageName)}">
        <option value="">בחר לקוח...</option>
        ${deviceOptions}
      </select>
      <button class="add-app-btn" data-assign-one="${escapeHtml(a.packageName)}">הוסף ללקוח</button>
      <button class="add-app-btn" data-install-store="${escapeHtml(a.packageName)}">התקן דרך Play Store</button>
    </div>
  `).join('');

  document.querySelectorAll('[data-refresh-icon]').forEach(btn => {
    btn.addEventListener('click', async () => {
      const packageName = btn.getAttribute('data-refresh-icon');
      const name = btn.getAttribute('data-refresh-name');
      btn.disabled = true;
      await fetch('/api/apps', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, packageName }),
      });
      loadAppsCatalog();
    });
  });

  document.querySelectorAll('[data-assign-all]').forEach(btn => {
    btn.addEventListener('click', async () => {
      const packageName = btn.getAttribute('data-assign-all');
      btn.disabled = true;
      btn.textContent = 'מוסיף...';
      await fetch(`/api/apps/${encodeURIComponent(packageName)}/assign-all`, { method: 'POST' });
      loadDevices();
    });
  });

  document.querySelectorAll('[data-assign-one]').forEach(btn => {
    btn.addEventListener('click', async () => {
      const packageName = btn.getAttribute('data-assign-one');
      const select = document.querySelector(`[data-device-select-for="${CSS.escape(packageName)}"]`);
      const deviceId = select.value;
      if (!deviceId) { alert('נא לבחור לקוח'); return; }
      await fetch(`/api/devices/${encodeURIComponent(deviceId)}/policy/apps`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ packageName }),
      });
      loadDevices();
    });
  });

  document.querySelectorAll('[data-install-store]').forEach(btn => {
    btn.addEventListener('click', async () => {
      const packageName = btn.getAttribute('data-install-store');
      const select = document.querySelector(`[data-device-select-for="${CSS.escape(packageName)}"]`);
      const deviceId = select.value;
      if (!deviceId) { alert('נא לבחור לקוח'); return; }

      btn.disabled = true;
      btn.textContent = 'שולח...';

      // Approve first so the app isn't hidden again once it's installed.
      await fetch(`/api/devices/${encodeURIComponent(deviceId)}/policy/apps`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ packageName }),
      });
      await fetch(`/api/devices/${encodeURIComponent(deviceId)}/commands`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ command: 'OPEN_PLAY_STORE_INSTALL', params: { packageName } }),
      });

      btn.disabled = false;
      btn.textContent = 'התקן דרך Play Store';
      loadDevices();
    });
  });
}

document.getElementById('addAppToCatalogBtn').addEventListener('click', async () => {
  const nameInput = document.getElementById('newAppName');
  const packageInput = document.getElementById('newAppPackage');
  const name = nameInput.value.trim();
  const packageName = packageInput.value.trim();
  if (!name || !packageName) { alert('נא למלא שם ומזהה חבילה'); return; }
  const res = await fetch('/api/apps', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ name, packageName }),
  });
  if (!res.ok) { alert('שם חבילה לא תקין. דוגמה: com.waze'); return; }
  nameInput.value = '';
  packageInput.value = '';
  loadAppsCatalog();
});

document.getElementById('catalogSearch').addEventListener('input', () => {
  renderCatalog(filterCatalog(document.getElementById('catalogSearch').value));
});

document.getElementById('deviceSearch').addEventListener('input', () => {
  renderDeviceList(filterDevices(document.getElementById('deviceSearch').value));
});

loadDevices();
</script>
</body>
</html>
